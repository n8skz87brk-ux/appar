<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:inherit}body{margin:0;padding:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}

<style>
/* Layout: one-screen card table (same family as Huvudstaden) — header, tall map card, answer bar at the thumb. */
:root{
  --table:#e6eaea;      /* the table */
  --card:#fbfcfb;       /* card face */
  --sea:#d4e3ec;        /* sea */
  --ink:#17242c;
  --muted:#5d6970;
  --land:#eeece3;
  --land-edge:#c6c4b8;
  --lake:#d4e3ec;       /* other lakes, same as the sea */
  --subject:#0a6fc2;    /* the river or lake that is asked about */
  --subject-edge:#06467c;
  --halo:#fbfcfb;
  --line:#cfd5d5;
  --btn:#17242c; --btn-fg:#fbfcfb;
  --good:#2f7d4f; --bad:#b03a2e; --accent:#0a6fc2;
  --label-halo:rgba(251,252,251,.92);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --table:#0e1418; --card:#161e24; --sea:#112230; --ink:#e7ecee; --muted:#98a4ab;
  --land:#262f37; --land-edge:#36414b; --lake:#112230; --subject:#4fb0ff; --subject-edge:#c6e5ff; --halo:#161e24;
  --line:#2b363f; --btn:#e7ecee; --btn-fg:#10161b;
  --good:#5fbf86; --bad:#ef7a6c; --accent:#4fb0ff; --label-halo:rgba(22,30,36,.92); color-scheme:dark}}
:root[data-theme="dark"]{
  --table:#0e1418; --card:#161e24; --sea:#112230; --ink:#e7ecee; --muted:#98a4ab;
  --land:#262f37; --land-edge:#36414b; --lake:#112230; --subject:#4fb0ff; --subject-edge:#c6e5ff; --halo:#161e24;
  --line:#2b363f; --btn:#e7ecee; --btn-fg:#10161b;
  --good:#5fbf86; --bad:#ef7a6c; --accent:#4fb0ff; --label-halo:rgba(22,30,36,.92); color-scheme:dark}

html,body{height:100%}
body{background:var(--table);color:var(--ink);font-family:var(--f-body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;overflow:hidden}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px;box-sizing:border-box}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.01em;margin:0;line-height:1;text-transform:uppercase}
.brand svg{width:24px;height:24px;flex:none}
.ctrls{display:flex;align-items:center;gap:8px}
.back{font:500 14px/1 var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.score{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.score b{color:var(--ink)}

.menu{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-block:6px 4px}
.menu .lead{margin:0;color:var(--muted);font-size:15px;line-height:1.45;max-width:46ch}
.menu .last{margin:0;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums}
.group{display:flex;flex-direction:column;gap:8px}
.group h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{font:600 15px/1.1 var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.pick:hover{border-color:var(--accent)}
.pick:disabled{opacity:.45;cursor:default}
.pick small{font-weight:500;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.pick.big{display:flex;flex-direction:column;gap:6px;padding:16px;min-height:76px;justify-content:center}
.pick.big span{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:.95}
.pick.big small{margin:0;font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:600 14px/1 var(--f-body);color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:9px 13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.ver{font-size:12px;color:var(--muted);margin-top:auto;font-variant-numeric:tabular-nums}

.card{flex:1;min-height:0;background:var(--card);border-radius:14px;border:1px solid var(--line);
  box-shadow:0 1px 0 rgba(0,0,0,.04),0 10px 30px -18px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;position:relative}
.card.swap-out{animation:out .22s ease-in forwards}
.card.swap-in{animation:in .3s ease-out}
@keyframes out{to{transform:translateX(-24px) rotate(-1.2deg);opacity:0}}
@keyframes in{from{transform:translateX(24px) rotate(1.2deg);opacity:0}}
.cardtop{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.mapwrap{flex:1;min-height:140px;position:relative;background:var(--sea)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);font-size:14px;pointer-events:none}

.q{padding:2px 16px 14px;display:flex;flex-direction:column;gap:4px}
.q .ask{font-size:15px;color:var(--muted);margin:0}
.q h2{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:.95;margin:0;text-transform:uppercase;text-wrap:balance;color:var(--subject)}
.result{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.res-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid}
.tag.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--card));background:color-mix(in srgb,var(--good) 12%,var(--card))}
.tag.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--card));background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.fact{font-size:14.5px;color:var(--ink);margin:0;line-height:1.4;max-width:52ch}
.alts{font-size:12.5px;color:var(--muted);margin:0}

.bar{display:flex;flex-direction:column;gap:8px}
.say{display:flex;gap:8px}
.say input{flex:1;min-width:0;font:500 17px/1 var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px}
.say input::placeholder{color:var(--muted)}
.say input:focus{outline:2px solid var(--accent);outline-offset:0}
.mic{flex:none;width:54px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.mic svg{width:22px;height:22px}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 25%,transparent)}}
.micmsg{font-size:12.5px;color:var(--muted);margin:0;line-height:1.35}
.btns{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.btns button{font:600 17px/1 var(--f-body);border-radius:12px;padding:16px 14px;border:1px solid transparent;cursor:pointer;min-height:54px}
.primary{background:var(--btn);color:var(--btn-fg)}
.primary:disabled{opacity:.45;cursor:default}
.ghost{background:none;border-color:var(--line)!important;color:var(--muted)}
.ghost:disabled{opacity:.45;cursor:default}
.btns.one{grid-template-columns:1fr}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-height:640px){.q h2{font-size:32px}.brand h1{font-size:24px}}

/* Liggande skärm: kartan till vänster, frågan till höger */
@media (orientation:landscape) and (min-width:640px){
  .app:has(#card:not([hidden])){max-width:none;display:grid;column-gap:16px;row-gap:8px;
    grid-template-columns:minmax(0,1fr) clamp(250px,30vw,440px);
    grid-template-rows:auto auto minmax(0,1fr) auto}
  .app:has(#card:not([hidden])) > header{grid-column:2;grid-row:1}
  .app:has(#card:not([hidden])) #card{display:contents}
  .app:has(#card:not([hidden])) .cardtop{grid-column:2;grid-row:2;padding:0}
  .app:has(#card:not([hidden])) .mapwrap{grid-column:1;grid-row:1 / -1;min-height:0;border-radius:14px;border:1px solid var(--line);overflow:hidden;
    box-shadow:0 1px 0 rgba(0,0,0,.04),0 10px 30px -18px rgba(0,0,0,.35)}
  .app:has(#card:not([hidden])) .q{grid-column:2;grid-row:3;padding:0;overflow-y:auto;align-self:start}
  .app:has(#card:not([hidden])) .bar{grid-column:2;grid-row:4}
  .app:has(#card:not([hidden])) .q h2{font-size:clamp(28px,3.6vw,52px)}
  .app:has(#card:not([hidden])) .btns button{min-height:48px;padding:12px 14px}
  .menu{max-width:720px;margin-inline:auto;width:100%}
}
@media (prefers-reduced-motion:reduce){.card.swap-out,.card.swap-in,.mic.on{animation:none}}
</style>

      </div>
    </div>
    <p class="ver"><a href="../">&larr; Alla Peters appar</a> · Version 1.0 · 3 november 2026</p>
  </section>

  <div class="card" id="card" hidden>
    <div class="cardtop"><span id="deckpos">Kort –</span><span id="regionlbl"></span></div>
    <div class="mapwrap" id="mapwrap">

    <div class="q">

        <p class="alts" id="r-alts" hidden></p>

  <div class="bar" id="bar" hidden>

      </button>
    </div>
    <p class="micmsg" id="micmsg" hidden></p>
    <div class="btns" id="btns">
      <button class="primary" id="go" disabled>Svara</button>
      <button class="ghost" id="hintbtn">Ledtråd</button>
      <button class="ghost" id="skip">Vet ej</button>
    </div>
  </div>
</div>

const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}
  return p[n];}
const FILLER=/^(det|den|jag|tror|ar|heter|kanske|svaret|floden|sjon|alven)+/;
const SUFFIX=/(floden|flod|sjon|sjo|alven|alv|strom|trask)$/;
const variants=s=>{const n=norm(s),out=[n];const t=n.replace(SUFFIX,"");if(t!==n&&t.length>=3)out.push(t);return out};
function nameMatches(said,accept){
  let g=norm(said); if(!g) return false;
  const gs=new Set([...variants(g),...variants(g.replace(FILLER,""))].filter(Boolean));
  for(const a of accept){
    for(const t of variants(a)){
      const tol=t.length<=5?0:t.length<=8?1:2;
      for(const x of gs){
        if(lev(x,t)<=tol) return true;
        if(t.length>=5&&x.length>t.length&&x.endsWith(t)) return true;
      }
    }
  }
  return false;
}

const WORLD="https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json/+esm";
const TOPO_CLIENT="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js";
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
const R2D=180/Math.PI;
let polys=[], worldPromise=null;
function ringPoly(r){let g={type:"Polygon",coordinates:[r]};if(d3.geoArea(g)>2*Math.PI)g={type:"Polygon",coordinates:[r.slice().reverse()]};return g}
function loadWorld(){
  if(worldPromise) return worldPromise;
  worldPromise=(async()=>{
    const [mod]=await Promise.all([import(WORLD), window.topojson?null:loadScript(TOPO_CLIENT)]);
    const topo=mod.default||mod;
    const fc=topojson.feature(topo,topo.objects.countries);
    for(const f of fc.features){
      if(!f.geometry||+f.id===10) continue;               // utan Antarktis
      const g=f.geometry, list=g.type==="Polygon"?[g.coordinates]:g.type==="MultiPolygon"?g.coordinates:[];
      for(const rings of list){
        let geom={type:"Polygon",coordinates:rings};
        if(d3.geoArea(geom)>2*Math.PI) geom={type:"Polygon",coordinates:rings.map(r=>r.slice().reverse())};
        const cen=d3.geoCentroid(geom);
        let rad=0; const ext=geom.coordinates[0], step=Math.max(1,Math.floor(ext.length/200));
        for(let i=0;i<ext.length;i+=step){const d=d3.geoDistance(cen,ext[i]);if(d>rad)rad=d}
        polys.push({geom,cen,rad:rad*R2D});
      }
    }
  })();
  worldPromise.catch(()=>{worldPromise=null});
  return worldPromise;
}
// geometry per item, built once
for(const d of DATA){
  d.geo=d.k==="P"?{type:"GeometryCollection",geometries:d.g.filter(r=>r.length>=4).map(ringPoly)}:{type:"MultiLineString",coordinates:d.g};
  d.cen=d3.geoCentroid(d.k==="P"?d.geo:{type:"MultiPoint",coordinates:d.g.flat()});
  if(!isFinite(d.cen[0])){const pts=d.g.flat();d.cen=[d3.mean(pts,p=>p[0]),d3.mean(pts,p=>p[1])];}
  d.accept=[d.n,...(d.a?d.a.split("|"):[])];
}
const LAKES=DATA.filter(d=>d.k==="P");

const canvas=document.getElementById("map"), ctx=canvas.getContext("2d"), wrap=document.getElementById("mapwrap");
let W=0,H=0,DPR=1;
const proj=d3.geoAzimuthalEqualArea().clipAngle(90).precision(.4);
const path=d3.geoPath(proj,ctx);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let C={};
function readColors(){C={land:css("--land"),edge:css("--land-edge"),lake:css("--lake"),subj:css("--subject"),subjEdge:css("--subject-edge"),halo:css("--halo"),ink:css("--ink"),lhalo:css("--label-halo")}}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{readColors();draw()});
new MutationObserver(()=>{readColors();draw()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

let cur=null;
function applyView(v){const s=W/v[2];proj.scale(s).translate([W/2-s*v[0],H/2-s*v[1]]);return s}
function computeView(){
  if(!cur||!W) return;
  proj.rotate([-cur.cen[0],-cur.cen[1]]).scale(1).translate([0,0]);
  const b=d3.geoPath(proj).bounds(cur.geo);
  const minExt=(cur.r==="Sverige"?8:13)/R2D;           // always show the surroundings
  let bw=Math.max(b[1][0]-b[0][0],minExt), bh=Math.max(b[1][1]-b[0][1],minExt);
  const cx=(b[0][0]+b[1][0])/2, cy=(b[0][1]+b[1][1])/2;
  const pad=Math.max(26,Math.min(W,H)*.1);
  const s=Math.min((W-2*pad)/bw,(H-2*pad)/bh);
  cur.view=[cx,cy,W/s];
}
function draw(){
  if(!W||!cur) return;
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  const s=applyView(cur.view);
  const center=proj.invert([W/2,H/2]); const viewDeg=(Math.hypot(W,H)/2)/s*R2D;
  const vis=(cen,rad)=>center&&(d3.geoDistance(center,cen)*R2D-rad<viewDeg*1.15+1);
  ctx.lineWidth=.6; ctx.strokeStyle=C.edge; ctx.fillStyle=C.land;
  for(const p of polys){ if(!vis(p.cen,p.rad)||p.rad/R2D*s<0.8) continue; ctx.beginPath();path(p.geom);ctx.fill();ctx.stroke(); }
  // other lakes, as water
  ctx.fillStyle=C.lake; ctx.strokeStyle=C.edge; ctx.lineWidth=.5;
  for(const l of LAKES){ if(l===cur.d||!vis(l.cen,3)) continue; ctx.beginPath();path(l.geo);ctx.fill();ctx.stroke(); }
  // the subject
  const d=cur.d;
  if(d.k==="L"){
    ctx.lineJoin="round";ctx.lineCap="round";
    ctx.strokeStyle=C.halo;ctx.lineWidth=7;ctx.beginPath();path(d.geo);ctx.stroke();
    ctx.strokeStyle=C.subj;ctx.lineWidth=3.6;ctx.beginPath();path(d.geo);ctx.stroke();
  }else{
    ctx.fillStyle=C.subj;ctx.strokeStyle=C.subjEdge;ctx.lineWidth=1.2;ctx.beginPath();path(d.geo);ctx.fill();ctx.stroke();
  }
  // ring around small targets
  const bb=d3.geoPath(proj).bounds(d.geo), size=Math.hypot(bb[1][0]-bb[0][0],bb[1][1]-bb[0][1]);
  const c=proj(d.cen);
  if(c&&size<34){
    ctx.save();ctx.strokeStyle=C.subj;ctx.lineWidth=2;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.arc(c[0],c[1],Math.max(16,size/2+10),0,Math.PI*2);ctx.stroke();ctx.restore();
  }
  if(cur.revealed&&c){
    const y=size<34?c[1]-Math.max(16,size/2+10)-12:Math.max(bb[0][1]-12,14);
    label(d.n,c[0],y);
  }
}
function label(txt,x,y){
  ctx.font="600 14px "+getComputedStyle(document.body).fontFamily;
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineJoin="round";
  const w=ctx.measureText(txt).width; x=Math.min(Math.max(x,w/2+6),W-w/2-6); y=Math.min(Math.max(y,14),H-14);
  ctx.lineWidth=4;ctx.strokeStyle=C.lhalo;ctx.strokeText(txt,x,y);ctx.fillStyle=C.ink;ctx.fillText(txt,x,y);
}
function resize(){
  const r=wrap.getBoundingClientRect(); W=Math.round(r.width);H=Math.round(r.height);DPR=Math.min(2,window.devicePixelRatio||1);
  if(!W||!H) return;
  canvas.width=W*DPR;canvas.height=H*DPR;

  stopMic();
  const d=cur.d, said=$("guess").value.trim();
  const ok=!skipped&&(nameMatches(said,d.accept)||cur.heard.some(h=>nameMatches(h,d.accept)));
  cur.revealed=true; if(ok) right++; else wrong.push(d);
  $("sc-p").textContent=right;
  $("ask").textContent=d.t==="flod"?(d.r==="Sverige"?"Älven heter":"Floden heter"):"Sjön heter";
  $("cname").textContent=d.n;
  const tag=$("r-tag");
  if(skipped){tag.className="tag no";tag.textContent="Hoppade över"}
  else if(ok){tag.className="tag ok";tag.textContent=cur.hints?"Rätt, med ledtråd":"Rätt!"}
  else{tag.className="tag no";tag.textContent=said?`Du svarade ${said}`:"Inget svar"}
  $("r-fact").textContent=d.f;
  const nv=variants(d.n);
  const alts=d.a?d.a.split("|").filter(a=>/[A-ZÅÄÖ]/.test(a[0])&&!/^(Lake|Lago)\b/.test(a)&&!variants(a).some(v=>nv.some(t=>lev(v,t)<=2))).slice(0,3):[];
  $("r-alts").hidden=!alts.length; $("r-alts").textContent=alts.length?"Kallas också: "+alts.join(", "):"";
  $("result").hidden=false; $("say").hidden=true; $("micmsg").hidden=true;
  $("skip").hidden=true; $("hintbtn").hidden=true; $("btns").className="btns one";
  updateGo(); draw();
}
function finish(){
  store.set("fs-last",{choice,right,n:order.length});
  cur=null; ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height);
  $("deckpos").textContent="Klart"; $("regionlbl").textContent=LABEL[choice];
  $("ask").textContent="Resultat";
  $("cname").textContent=`${right} av ${order.length} rätt`;
  $("r-tag").className="tag "+(right>=order.length*.7?"ok":"no");
  $("r-tag").textContent=right===order.length?"Fullpott!":right>=order.length*.7?"Bra jobbat":right>=order.length*.4?"Godkänt":"Försök igen";
  $("r-fact").textContent=wrong.length?"Öva mer på: "+wrong.map(w=>w.n).join(", ")+".":"Alla rätt.";
  $("r-alts").hidden=true; $("result").hidden=false;
  $("status").hidden=false; $("status").textContent="Bra spelat!";
  $("go").textContent="Spela igen"; $("go").disabled=false; $("go").dataset.again="1";
}
async function next(){
  if(busy) return; busy=true;
  const card=$("card");
  if(pos>=0&&!reduce){card.classList.add("swap-out");await new Promise(r=>setTimeout(r,220));card.classList.remove("swap-out");}
  pos++;
  if(pos>=order.length){finish();busy=false;return}
  setupCard(order[pos]); renderAsk(); draw();
  if(!reduce){card.classList.add("swap-in");setTimeout(()=>card.classList.remove("swap-in"),320);}
  busy=false;
}
async function start(ch){
  choice=ch;
  order=deckFor(ch,opts.typ,opts.niva).slice().sort(()=>Math.random()-.5).slice(0,ROUNDS);
  if(!order.length) return;
  pos=-1; right=0; wrong=[];
  $("sc-p").textContent="0"; delete $("go").dataset.again;
  $("menu").hidden=true; $("card").hidden=false; $("bar").hidden=false; $("back").hidden=false; $("score").hidden=false;
  $("say").hidden=true; $("result").hidden=true; $("cname").innerHTML="&nbsp;"; $("go").disabled=true;
  resize(); readColors();
  $("status").hidden=false; $("status").textContent="Laddar världskartan …";
  try{ await loadWorld(); }catch(e){ $("status").textContent="Kartan kunde inte laddas. Kontrollera nätet och tryck på Byt spel för att försöka igen."; return; }
  $("status").hidden=true; resize(); next();
}
function toMenu(){
  stopMic(); cur=null; refreshMenu();
  $("menu").hidden=false; $("card").hidden=true; $("bar").hidden=true; $("back").hidden=true; $("score").hidden=true;
}
document.querySelectorAll("[data-choice]").forEach(b=>b.addEventListener("click",()=>start(b.dataset.choice)));
$("back").addEventListener("click",toMenu);
$("go").addEventListener("click",()=>{
  if($("go").dataset.again){start(choice);return}
  if(!cur) return;
  if(cur.revealed) next(); else if($("guess").value.trim()) reveal(false);
});
$("skip").addEventListener("click",()=>{if(cur&&!cur.revealed)reveal(true)});
$("hintbtn").addEventListener("click",hint);
$("guess").addEventListener("keydown",e=>{
  if(e.key!=="Enter") return; e.preventDefault(); $("guess").blur();
  if(cur&&!cur.revealed&&$("guess").value.trim()) reveal(false);
});

// ---------- Tala in namnet ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, rec0=null, listening=false;
function micMsg(t){$("micmsg").textContent=t;$("micmsg").hidden=!t}
if(SR) $("mic").hidden=false;
function stopMic(){ if(rec&&listening){try{rec.stop()}catch(e){}} listening=false; $("mic").classList.remove("on"); }
$("mic").addEventListener("click",()=>{
  if(!cur||cur.revealed) return;
  if(listening){stopMic();return}
  try{
    rec=new SR(); rec.lang="sv-SE"; rec.interimResults=true; rec.maxAlternatives=5; rec.continuous=false;
    const card=cur;
    rec.onresult=e=>{
      const r=e.results[e.results.length-1];
      $("guess").value=r[0].transcript.trim(); updateGo();
      if(r.isFinal){ card.heard=Array.from(r,a=>a.transcript);
        const hit=card.heard.find(h=>nameMatches(h,card.d.accept)); if(hit) $("guess").value=hit.trim(); updateGo(); }
    };
    rec.onerror=e=>{
      stopMic();
      if(e.error==="not-allowed"||e.error==="service-not-allowed"){
        micMsg("Mikrofonen är spärrad här. Skriv namnet, eller använd mikrofonknappen på telefonens tangentbord.");
      }else if(e.error==="no-speech") micMsg("Hörde inget. Tryck på mikrofonen och säg namnet igen.");
      else micMsg("Taligenkänningen svarade inte. Skriv namnet i stället.");
    };
    rec.onend=()=>{listening=false;$("mic").classList.remove("on")};
    if(rec0){try{rec0.abort()}catch(e){}} rec0=rec;
    rec.start(); listening=true; $("mic").classList.add("on"); micMsg("");
  }catch(e){ stopMic(); micMsg("Taligenkänning stöds inte här. Skriv namnet eller använd tangentbordets mikrofon."); }
});
readColors();
</script>
