<style>
/* Layout: rope band on top, then three columns — left team | question | right team. Stacks on phones. */
:root{
  --bg:#eef2ec; --surface:#ffffff; --fg:#1b221d; --muted:#5d6b61; --line:#cfd8cf;
  --left:#2c5bd0; --left-soft:#dfe7fb; --right:#d2452a; --right-soft:#fbe3dd;
  --rope:#b8935a; --rope-dark:#8a6a3a; --knot:#e2b007; --ok:#2e8b4e; --bad:#c43a3a;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121814; --surface:#1c241f; --fg:#e9efe9; --muted:#9aa89e; --line:#2f3a33;
  --left:#6f95f0; --left-soft:#1f2b48; --right:#f07a5f; --right-soft:#46241d;
  --rope:#c9a56b; --rope-dark:#9b7b48; --knot:#f0c430; --ok:#5cc47f; --bad:#ef6b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1c241f; --fg:#e9efe9; --muted:#9aa89e; --line:#2f3a33;
  --left:#6f95f0; --left-soft:#1f2b48; --right:#f07a5f; --right-soft:#46241d;
  --rope:#c9a56b; --rope-dark:#9b7b48; --knot:#f0c430; --ok:#5cc47f; --bad:#ef6b6b; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;
  box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:.01em;text-wrap:balance}
h1 .s{color:var(--left)} h1 .f{color:var(--right)}
.meta{color:var(--muted);font-size:14px;display:flex;gap:14px;align-items:center}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.ghost:hover{color:var(--fg);border-color:var(--muted)}

/* Rope */
.field{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 0 12px;position:relative;overflow:hidden}
.names{display:flex;justify-content:space-between;padding:0 18px;gap:10px}
.names input{font-family:var(--display);font-size:clamp(15px,2.2vw,20px);border:none;background:transparent;width:100%;min-width:0;padding:2px 0;border-bottom:2px dashed transparent}
.names input:focus{outline:none;border-bottom-color:var(--line)}
#nameL{color:var(--left)} #nameR{color:var(--right);text-align:right}
.track{position:relative;height:96px;margin-top:6px}
.mark{position:absolute;top:10px;bottom:10px;width:0;border-left:2px dashed var(--line)}
.mark.mid{border-left:2px solid var(--muted);opacity:.6}
.mark.goalL{border-left:4px solid var(--left)} .mark.goalR{border-left:4px solid var(--right)}
.tick{position:absolute;bottom:-4px;transform:translateX(-50%);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rope{position:absolute;top:50%;left:-40%;width:180%;height:14px;margin-top:-7px;border-radius:7px;
  background:repeating-linear-gradient(115deg,var(--rope) 0 8px,var(--rope-dark) 8px 11px);
  transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.knot{position:absolute;left:50%;top:50%;width:26px;height:44px;margin:-22px 0 0 -13px;background:var(--knot);border-radius:5px;
  box-shadow:0 0 0 3px var(--surface)}
.pull{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rope.shake{animation:shake .45s}
@keyframes shake{25%{translate:4px 0}50%{translate:-4px 0}75%{translate:3px 0}}

/* Arena */
.arena{display:grid;grid-template-columns:1fr minmax(0,1.6fr) 1fr;gap:16px;align-items:stretch}
.team{border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;border:2px solid transparent;min-width:0}
.team.L{background:var(--left-soft)} .team.R{background:var(--right-soft)}
.team.active.L{border-color:var(--left)} .team.active.R{border-color:var(--right)}
.team h2{margin:0;font-family:var(--display);font-weight:400;font-size:18px;overflow-wrap:anywhere}
.team.L h2{color:var(--left)} .team.R h2{color:var(--right)}
.status{font-size:15px;color:var(--muted);min-height:1.4em}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.btn{font-family:var(--display);font-size:20px;letter-spacing:.03em;padding:18px 10px;border-radius:12px;border:2px solid var(--fg);background:var(--surface);color:var(--fg);cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.ghost:focus-visible,.go:focus-visible{outline:3px solid var(--knot);outline-offset:2px}
.btn:disabled{opacity:.35;cursor:default}
.team.L .btn{border-color:var(--left);color:var(--left)} .team.R .btn{border-color:var(--right);color:var(--right)}
.locked{display:flex;align-items:center;justify-content:center;gap:8px;padding:30px 10px;border-radius:12px;border:2px dashed currentColor;font-weight:700;margin-top:auto}
.team.L .locked{color:var(--left)} .team.R .locked{color:var(--right)}
.verdict{font-family:var(--display);font-size:22px;padding:16px 10px;border-radius:12px;text-align:center;margin-top:auto;color:#fff}
.verdict.ok{background:var(--ok)} .verdict.bad{background:var(--bad)}
.verdict small{display:block;font-family:var(--body);font-size:14px;font-weight:700;opacity:.9}

.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.qlabel{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.qtext{font-size:clamp(21px,2.6vw,28px);font-weight:700;line-height:1.3;margin:0;text-wrap:balance}
.answer{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.answer b{font-family:var(--display);font-weight:400;font-size:22px}
.answer b.t{color:var(--ok)} .answer b.f{color:var(--bad)}
.answer p{margin:0;color:var(--muted);max-width:60ch}
.result{font-weight:700}
.go{margin-top:auto;align-self:flex-start;font-family:var(--display);font-size:18px;padding:14px 22px;border-radius:12px;border:none;background:var(--fg);color:var(--bg);cursor:pointer}
.hint{color:var(--muted);font-size:15px;margin:0}

.win{text-align:center;padding:30px 20px;border-radius:14px;color:#fff;display:flex;flex-direction:column;gap:14px;align-items:center}
.win.L{background:var(--left)} .win.R{background:var(--right)}
.win h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,44px);margin:0;text-wrap:balance}
.win p{margin:0}
.win .go{background:#fff;color:#1b221d;align-self:center}

.answer .result{color:var(--fg);font-weight:700}
@media (max-width:760px){
  body{padding-block:10px;font-size:16px}
  .wrap{gap:12px}
  header{flex-wrap:nowrap;align-items:center}
  h1{font-size:24px}
  .field{padding:10px 0 6px}
  .track{height:64px;margin-top:2px}
  .knot{width:22px;height:34px;margin:-17px 0 0 -11px}
  .arena{grid-template-columns:1fr 1fr;gap:10px}
  .q{grid-column:1/-1;order:-1;padding:16px;gap:10px}
  .arena.phase-reveal .q{order:1}
  .team{padding:12px;gap:8px}
  .team h2{font-size:16px}
  .status{font-size:14px}
  .btn{font-size:17px;padding:14px 8px}
  .locked{padding:20px 8px}
  .verdict{font-size:18px;padding:10px 8px}
  .qtext{font-size:20px}
  .go{padding:12px 20px;font-size:17px}
}
@media (prefers-reduced-motion:reduce){.rope{transition:none}.rope.shake{animation:none}}
</style>

const $=s=>document.querySelector(s);
const main=$('#main'), rope=$('#rope');
let deck=[], qi=0, pos=0, round=1, phase='left', ansL=null, ansR=null, wins={L:0,R:0};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function names(){return {L:$('#nameL').value.trim()||'Vänster lag',R:$('#nameR').value.trim()||'Höger lag'}}
function cur(){return deck[qi]}
function word(b){return b?'Sant':'Falskt'}

function newMatch(){deck=shuffle(Q.map((_,i)=>i));qi=0;pos=0;round=1;phase='left';ansL=ansR=null;drawRope();render()}
function drawRope(){rope.style.transform=`translateX(${pos*(12/1.8)}%)`}
// rope is 180% of track; 12% of track per step = 12/1.8 % of rope width

function teamPanel(side){
  const n=names()[side], q=Q[cur()], active=(phase==='left'&&side==='L')||(phase==='right'&&side==='R');
  let body='';
  if(phase==='reveal'){
    const a=side==='L'?ansL:ansR, ok=a===q[1];
    body=`<div class="status">Svarade ${word(a).toLowerCase()}</div><div class="verdict ${ok?'ok':'bad'}">${ok?'Rätt!':'Fel'}<small>${word(a)}</small></div>`;
  } else if(side==='L'){
    body = phase==='left'
      ? `<div class="status">Er tur att svara</div><div class="btns"><button class="btn" data-a="1">Sant</button><button class="btn" data-a="0">Falskt</button></div>`
      : `<div class="status">Svaret är hemligt</div><div class="locked">Svar låst</div>`;
  } else {
    body = phase==='right'
      ? `<div class="status">Er tur att svara</div><div class="btns"><button class="btn" data-a="1">Sant</button><button class="btn" data-a="0">Falskt</button></div>`
      : `<div class="status">Väntar på ${esc(names().L)}</div><div class="btns"><button class="btn" disabled>Sant</button><button class="btn" disabled>Falskt</button></div>`;
  }
  return `<section class="team ${side}${active?' active':''}" data-side="${side}"><h2>${esc(n)}</h2>${body}</section>`;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function render(){
  $('#roundInfo').textContent=`Runda ${round}`;
  if(phase==='win'){
    const side=pos<=-3?'L':'R', n=names()[side];
    main.innerHTML=`<div class="win ${side}"><h2>${esc(n)} vinner!</h2><p>Repet drogs över linjen efter ${round} rundor.</p><button class="go" id="again">Spela igen</button></div>`;
    $('#again').onclick=newMatch; $('#again').focus(); return;
  }
  const q=Q[cur()];
  let center=`<div class="qlabel">Fråga ${round}</div><p class="qtext">${q[0]}</p>`;
  if(phase==='left') center+=`<p class="hint">${esc(names().L)} svarar först. ${esc(names().R)} tittar bort.</p>`;
  if(phase==='right') center+=`<p class="hint">${esc(names().L)} har låst sitt svar. Nu svarar ${esc(names().R)}.</p>`;
  if(phase==='reveal'){
    const okL=ansL===q[1], okR=ansR===q[1], n=names();
    let res = okL===okR ? (okL?'Båda hade rätt. Repet står still.':'Båda hade fel. Repet står still.')
      : `${okL?n.L:n.R} drar repet ett steg.`;
    center+=`<div class="answer"><b class="${q[1]?'t':'f'}">${word(q[1])}</b><p class="result">${esc(res)}</p><p>${q[2]}</p></div><button class="go" id="next">Nästa fråga</button>`;
  }
  main.innerHTML=`<div class="arena phase-${phase}">${teamPanel('L')}<section class="q">${center}</section>${teamPanel('R')}</div>`;
  main.querySelectorAll('.btn[data-a]').forEach(b=>b.onclick=()=>answer(b.closest('.team').dataset.side,b.dataset.a==='1'));
  const nx=$('#next'); if(nx){nx.onclick=next; nx.focus();}
}

function answer(side,val){
  if(side==='L'&&phase==='left'){ansL=val;phase='right';render();return}
  if(side==='R'&&phase==='right'){
    ansR=val;phase='reveal';
    const t=Q[cur()][1], okL=ansL===t, okR=ansR===t;
    if(okL&&!okR)pos--; else if(okR&&!okL)pos++;
    else{rope.classList.remove('shake');void rope.offsetWidth;rope.classList.add('shake')}
    drawRope();render();
  }
}
function next(){
  if(Math.abs(pos)>=3){phase='win';render();return}
  qi++; if(qi>=deck.length){deck=shuffle(deck);qi=0}
  round++;ansL=ansR=null;phase='left';render();
}

$('#restart').onclick=newMatch;
['#nameL','#nameR'].forEach(s=>$(s).addEventListener('input',()=>{if(phase!=='win')render()}));
newMatch();
</script>

<script>if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
