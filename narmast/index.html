/* Layout: one-screen studio game — scoreboard band, station-sign clue, full map, action bar */
:root{
  --night:#0f1a2b;      /* studio/sea */
  --sea:#14243a;
  --land:#2c4152;
  --border:#4a6276;
  --ink:#eef1ea;
  --muted:#9fb0bd;
  --sign:#f2c230;       /* station-sign yellow */
  --p1:#ff6b5a;         /* team red */
  --p2:#5ec8ff;         /* team blue */
  --truth:#ffffff;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Overpass","Helvetica Neue",Arial,sans-serif;
  --mono:"Overpass Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--night);z-index:10}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Scoreboard */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-block:10px;background:#0a1220;border-bottom:1px solid #22344a}
.team{display:flex;align-items:center;gap:8px;min-width:0}
.team.r{justify-content:flex-end;text-align:right}
.team .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.team .pts{font-family:var(--display);font-size:30px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}
.team.t1 .pts{color:var(--p1)} .team.t2 .pts{color:var(--p2)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.t1 .dot{background:var(--p1)} .t2 .dot{background:var(--p2)}
.round{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;white-space:nowrap}

/* Station sign clue */
.clue{padding-block:10px}
.sign{background:var(--sign);color:#14171c;border-radius:6px;padding:8px 14px 10px;display:flex;flex-direction:column;gap:2px;box-shadow:0 3px 0 #a7841c}
.sign .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;opacity:.75}
.sign .place{font-family:var(--display);font-weight:900;font-size:clamp(30px,8vw,46px);line-height:1;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sign .sub{font-size:13px;font-weight:600}
.sign .sub a{color:inherit}
.pic{margin-top:8px;position:relative;height:clamp(120px,24vh,230px);border-radius:6px;overflow:hidden;background:#1b2c42;display:grid;place-items:center;color:var(--muted);font-size:13px;cursor:zoom-in}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic .hint{position:absolute;right:8px;bottom:8px;background:#0a1220cc;color:var(--ink);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600}
.picfull{position:fixed;inset:0;z-index:30;background:#05090fef;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.picfull img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}

/* Map */
.mapbox{flex:1;position:relative;min-height:0;background:var(--sea);touch-action:none}
#map{width:100%;height:100%;display:block}
.land{fill:var(--land);stroke:var(--border);stroke-width:.6px;vector-effect:non-scaling-stroke}
.grat{fill:none;stroke:#ffffff10;stroke-width:1px;vector-effect:non-scaling-stroke}
.arc{fill:none;stroke-width:2.5px;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
.mapnote{position:absolute;left:12px;right:12px;bottom:12px;background:#0a1220e6;border:1px solid #22344a;border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted)}
.zoombtns{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:6px}
.zoombtns button{width:38px;height:38px;border-radius:8px;border:1px solid #2c4258;background:#0a1220d9;color:var(--ink);font-size:20px;font-weight:800;line-height:1}
.legend-box{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;background:#0a1220e6;border:1px solid #2c4258;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:13px;max-width:calc(100% - 80px)}
.legend-box .row{display:flex;align-items:center;gap:8px;white-space:nowrap}
.legend-box .km{font-family:var(--mono);font-weight:700;margin-left:auto;padding-left:10px;font-variant-numeric:tabular-nums}
.legend-box .row.win .nm2{font-weight:800}
.legend-box .sw{width:12px;height:12px;border-radius:50%;flex:none}
.legend-box .tgt{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--sign);flex:none}
.dist-tag{font-family:var(--mono);font-weight:700;font-size:13px;paint-order:stroke;stroke:#0a1220;stroke-width:4px}

/* Action bar */
.bar{padding-block:12px;background:#0a1220;border-top:1px solid #22344a;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.msg{flex:1 1 180px;min-width:0;font-size:14px;line-height:1.35}
.msg b{font-weight:800}
.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:800;font-size:15px;background:var(--sign);color:#14171c;white-space:nowrap}
.btn[disabled]{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #3a5068}
.btn.p1{background:var(--p1);color:#1a0d0b}
.btn.p2{background:var(--p2);color:#071722}

/* Overlay screens */
.overlay{position:fixed;inset:0;background:#0a1220f2;display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
.logo{font-family:var(--display);font-weight:900;font-size:58px;line-height:.9;text-transform:uppercase;color:var(--sign)}
.logo small{display:block;font-family:var(--body);font-size:14px;font-weight:600;color:var(--muted);text-transform:none;margin-top:10px;line-height:1.4}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.legend{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.field input{background:#13202f;border:1px solid #2c4258;border-radius:8px;color:var(--ink);padding:11px 12px;font:inherit;font-size:16px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names .field:first-child input{border-left:4px solid var(--p1)}
.names .field:last-child input{border-left:4px solid var(--p2)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;border:1px solid #2c4258;background:#13202f;color:var(--ink);border-radius:8px;padding:10px 12px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--sign);color:#14171c;border-color:var(--sign)}
.ver{margin:0;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);line-height:1.4}
.check input{width:20px;height:20px;accent-color:var(--sign);flex:none;margin-top:1px}
.handoff{text-align:center;align-items:center;margin-top:12vh}
.handoff .big{font-family:var(--display);font-weight:900;font-size:44px;text-transform:uppercase;line-height:1}
.handoff p{color:var(--muted);margin:0}
.result-row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid #22344a;gap:12px}
.result-row .n{font-weight:800}
.result-row .v{font-family:var(--display);font-weight:900;font-size:34px;font-variant-numeric:tabular-nums}
.result-row .k{font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}

<div class="app" id="app">
  <header class="board wrap">

    <div class="legend-box" id="legend" hidden></div>
  </div>
  <footer class="bar wrap">
    <div class="msg" id="msg">Laddar kartan…</div>
    <button class="btn" id="action" disabled>Lås pilen</button>
  </footer>
</div>

<!-- Start screen -->
<div class="overlay" id="startScr">
  <div class="card">
    <div class="logo">Närmast<br>vinner<small>Två lag sätter ut var sin pil på kartan. Den som hamnar närmast rätt plats tar poängen.</small></div>
    <div class="names">
      <div class="field"><label for="in1">Lag 1</label><input id="in1" value="Lag 1" maxlength="18" autocomplete="off"></div>
      <div class="field"><label for="in2">Lag 2</label><input id="in2" value="Lag 2" maxlength="18" autocomplete="off"></div>
    </div>
    <div class="field"><span class="legend">Karta</span>
      <div class="seg" id="segMap">
        <button data-v="europa" aria-pressed="true">Europa</button>
        <button data-v="sverige" aria-pressed="false">Sverige</button>
        <button data-v="varlden" aria-pressed="false">Världen</button>
      </div>
    </div>
    <div class="field"><span class="legend">Ledtråd</span>
      <div class="seg" id="segClue">
        <button data-v="namn" aria-pressed="true">Namn</button>
        <button data-v="bild" aria-pressed="false">Bild</button>
        <button data-v="blandat" aria-pressed="false">Blandat</button>
      </div>
    </div>
    <div class="field"><span class="legend">Antal frågor</span>
      <div class="seg" id="segN">
        <button data-v="5" aria-pressed="false">5</button>
        <button data-v="10" aria-pressed="true">10</button>
        <button data-v="15" aria-pressed="false">15</button>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="hide" checked>Dölj första lagets pil medan andra laget gissar (när ni delar en telefon)</label>
    <button class="btn" id="startBtn">Kör!</button>
    <p class="ver">Version 1.2 · 2 november 2026</p>
  </div>
</div>

<div class="picfull" id="picFull" hidden role="button" aria-label="Stäng bilden"></div>

<!-- Hand-over screen -->
<div class="overlay" id="handScr" hidden>
  <div class="card handoff">
    <p>Pilen är låst. Lämna över till</p>
    <div class="big" id="handName">Lag 2</div>
    <p>Inte tjuvkika på kartan!</p>
    <button class="btn p2" id="handBtn">Jag är redo</button>
  </div>
</div>

<!-- End screen -->
<div class="overlay" id="endScr" hidden>
  <div class="card">
    <div class="logo" id="winner">Vinnare</div>
    <div>
      <div class="result-row"><div><div class="n" id="e1n"></div><div class="k" id="e1k"></div></div><div class="v" style="color:var(--p1)" id="e1v"></div></div>
      <div class="result-row"><div><div class="n" id="e2n"></div><div class="k" id="e2k"></div></div><div class="v" style="color:var(--p2)" id="e2v"></div></div>
    </div>
    <button class="btn" id="againBtn">Spela igen</button>
  </div>
</div>

const imgCache = {}; // place name -> Promise<{src,url,cap}|null>
const BAD_IMG = /map|karta|locat|position|coat_of_arms|vapen|flag|logo|seal|\.svg/i;
function wikiImage(title){
  return fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title.replace(/ /g,"_")))
    .then(r=>r.ok?r.json():null)
    .then(j=>{
      if(!j||!j.thumbnail||!j.thumbnail.source) return null;
      const orig=(j.originalimage&&j.originalimage.source)||j.thumbnail.source;
      if(BAD_IMG.test(decodeURIComponent(orig))) return null;
      const t=j.thumbnail.source, sized=w=>t.replace(/\/(\d+)px-/,"/"+w+"px-");
      const url=(j.content_urls&&j.content_urls.mobile&&j.content_urls.mobile.page)||("https://en.wikipedia.org/wiki/"+encodeURIComponent(title));
      const cands=[...new Set([sized(960),sized(500),t])];
      return {cands,url};
    }).catch(()=>null);
}
function firstLoading(list){
  return new Promise(ok=>{
    const next=i=>{ if(i>=list.length) return ok(null);
      const im=new Image(); im.onload=()=>ok(list[i]); im.onerror=()=>next(i+1); im.src=list[i]; };
    next(0);
  });
}
function getPic(q){
  const name=q[0];
  if(!imgCache[name]){
    const def=PIC[name];
    imgCache[name] = !def ? Promise.resolve(null) :
      wikiImage(def[0]).then(r=> r ? firstLoading(r.cands).then(src=> src ? {src,url:r.url,cap:def[1]} : null) : null);
  }
  return imgCache[name];
}
/* Map views: [west, south, east, north] */
const VIEW = {
  europa:{bbox:[-24,34,42,71.5], proj:()=>d3.geoAzimuthalEqualArea().rotate([-12,-52])},
  sverige:{bbox:[10.5,55.2,24.4,69.2], proj:()=>d3.geoTransverseMercator().rotate([-16,0])},
  varlden:{bbox:[-180,-58,180,80], proj:()=>d3.geoNaturalEarth1()}
};

/* ---------- State ---------- */
const S = {mode:"europa", clue:"namn", kinds:[], pic:null, n:10, hide:true, names:["Lag 1","Lag 2"], score:[0,0], km:[0,0],
  qs:[], i:0, turn:0, starter:0, pins:[null,null], locked:[false,false], phase:"guess"};
const $ = id=>document.getElementById(id);

/* ---------- Geo decode (ECharts compressed GeoJSON) ---------- */
function decodeRing(str, off, scale){
  const out=[]; let px=off[0], py=off[1];
  for(let i=0;i<str.length;i+=2){
    let x=str.charCodeAt(i)-64, y=str.charCodeAt(i+1)-64;
    x=(x>>1)^(-(x&1)); y=(y>>1)^(-(y&1));
    x+=px; y+=py; px=x; py=y;
    out.push([x/scale, y/scale]);
  }
  return out;
}
function decodeGeo(geo){
  if(!geo || !geo.features) return null;
  if(!geo.UTF8Encoding) return geo;
  const scale = geo.UTF8Scale || 1024;
  geo.features.forEach(f=>{
    const g=f.geometry; if(!g) return;
    if(g.type==="Polygon"){
      g.coordinates = g.coordinates.map((r,k)=> typeof r==="string" ? decodeRing(r,g.encodeOffsets[k],scale) : r);
    } else if(g.type==="MultiPolygon"){
      g.coordinates = g.coordinates.map((poly,c)=> poly.map((r,k)=> typeof r==="string" ? decodeRing(r,g.encodeOffsets[c][k],scale) : r));
    }
  });
  geo.UTF8Encoding=false;
  return geo;
}
/* Flatten to a list of rings with a lon/lat bounding box each.
   Land is drawn as plain projected polygons (even-odd fill), which avoids the
   spherical winding problems that made the land fill the whole globe. */
function toRings(geo){
  const rings=[];
  geo.features.forEach(f=>{
    const g=f.geometry; if(!g) return;
    const name=(f.properties&&f.properties.name)||"";
    if(name==="Antarctica") return;
    const polys = g.type==="Polygon"?[g.coordinates]:g.type==="MultiPolygon"?g.coordinates:[];
    polys.forEach(poly=>poly.forEach(r=>{
      if(!r || r.length<3) return;
      let w=180,e=-180,s=90,n=-90;
      r.forEach(p=>{ if(p[0]<w)w=p[0]; if(p[0]>e)e=p[0]; if(p[1]<s)s=p[1]; if(p[1]>n)n=p[1]; });
      rings.push({r,b:[w,s,e,n]});
    }));
  });
  return rings.length?rings:null;
}
function landPath(){
  const v=VIEW[S.mode], m=S.mode==="varlden"?999:25;
  const [W0,S0,E0,N0]=v.bbox;
  let d="";
  world.forEach(({r,b})=>{
    if(b[2]<W0-m||b[0]>E0+m||b[3]<S0-m||b[1]>N0+m) return;
    let seg="";
    for(let i=0;i<r.length;i++){
      const p=projection(r[i]); if(!p||!isFinite(p[0])||!isFinite(p[1])) { seg=""; break; }
      seg += (i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1);
    }
    if(seg) d+=seg+"Z";
  });
  return d;
}

/* ---------- Map ---------- */
const svg = d3.select("#map");
const gMap = svg.append("g");
const gGrat = gMap.append("path").attr("class","grat");
const gLand = gMap.append("g");
const gArcs = gMap.append("g");
const gPins = svg.append("g");
let projection, path, zoom, T=d3.zoomIdentity, W=0, H=0, world=null;

function size(){
  const r=$("mapbox").getBoundingClientRect(); W=Math.max(1,r.width); H=Math.max(1,r.height);
  svg.attr("viewBox",`0 0 ${W} ${H}`);
}
function bboxFeature(b){
  const pts=[]; const [w,s,e,n]=b;
  for(let i=0;i<=20;i++){const x=w+(e-w)*i/20; pts.push([x,s],[x,n]);}
  for(let i=0;i<=20;i++){const y=s+(n-s)*i/20; pts.push([w,y],[e,y]);}
  return {type:"MultiPoint",coordinates:pts};
}
function buildMap(){
  size();
  const v=VIEW[S.mode];
  projection=v.proj().fitExtent([[12,12],[W-12,H-12]], bboxFeature(v.bbox));
  path=d3.geoPath(projection);
  gGrat.attr("d", path(d3.geoGraticule10()));
  gLand.selectAll("path").remove();
  if(world){
    gLand.append("path").attr("class","land").attr("fill-rule","evenodd").attr("d",landPath());
  }
  zoom=d3.zoom().scaleExtent([1,S.mode==="varlden"?400:80]).translateExtent([[-W*.25,-H*.25],[W*1.25,H*1.25]])
    .on("zoom",e=>{T=e.transform; gMap.attr("transform",T); drawPins();});
  svg.call(zoom).on("dblclick.zoom",null);
  svg.call(zoom.transform,d3.zoomIdentity);
  drawArcs(); drawPins();
}
$("zin").onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1.6);
$("zout").onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.6);

svg.on("click",function(ev){
  if(S.phase!=="guess") return;
  const [x,y]=d3.pointer(ev,this);
  const ll=projection.invert(T.invert([x,y]));
  if(!ll || !isFinite(ll[0])) return;
  S.pins[S.turn]=ll; drawPins(true); updateUI();
});

const COLORS=["var(--p1)","var(--p2)"];
function pinShape(sel,color,label){
  sel.append("path").attr("d","M0,0 C-3,-8 -13,-14 -13,-25 A13,13 0 1 1 13,-25 C13,-14 3,-8 0,0Z")
    .attr("fill",color).attr("stroke","#0a1220").attr("stroke-width",2);
  sel.append("circle").attr("r",3).attr("fill",color).attr("stroke","#0a1220").attr("stroke-width",1.5);
  sel.append("text").text(label).attr("y",-20.5).attr("text-anchor","middle")
    .attr("font-family","var(--display)").attr("font-weight",900).attr("font-size",15).attr("fill","#0a1220");
}
function scr(ll){ const p=projection(ll); return p?T.apply(p):null; }
function drawPins(popLast){
  gPins.selectAll("*").remove();
  if(!projection) return;
  const q=S.qs[S.i];
  const visible=[0,1].filter(k=>{
    if(!S.pins[k]) return false;
    if(S.phase==="reveal") return true;
    if(k===S.turn) return true;
    return !S.hide; // other team's locked pin
  });
  visible.forEach(k=>{
    const p=scr(S.pins[k]); if(!p) return;
    const g=gPins.append("g").attr("transform",`translate(${p[0]},${p[1]})`);
    const inner=g.append("g"); pinShape(inner,COLORS[k],tag(k));
    if(popLast && k===S.turn) inner.attr("class","pop").style("transform-origin","0 0");
  });
  if(S.phase==="reveal" && q){
    const p=scr([q[3],q[2]]);
    if(p){
      const g=gPins.append("g").attr("transform",`translate(${p[0]},${p[1]})`);
      g.append("circle").attr("r",13).attr("fill","none").attr("stroke","var(--sign)").attr("stroke-width",2.5);
      g.append("circle").attr("r",5).attr("fill","var(--sign)").attr("stroke","#0a1220").attr("stroke-width",1.5).attr("class","pop");
    }
  }
}
function drawArcs(){
  gArcs.selectAll("*").remove();
  const q=S.qs[S.i];
  if(S.phase!=="reveal"||!q||!path) return;
  [0,1].forEach(k=>{
    if(!S.pins[k]) return;
    gArcs.append("path").attr("class","arc").attr("stroke",COLORS[k])
      .attr("d",path({type:"LineString",coordinates:[S.pins[k],[q[3],q[2]]]}));
  });
}

/* ---------- Helpers ---------- */
function dist(a,b){ return d3.geoDistance(a,b)*6371; }
function fmtKm(d){ return d<10 ? d.toFixed(1).replace(".",",")+" km" : Math.round(d).toLocaleString("sv-SE")+" km"; }
function initial(n){ return (n.trim()[0]||"?").toUpperCase(); }
function tag(k){ const a=initial(S.names[0]), b=initial(S.names[1]); return a===b ? String(k+1) : initial(S.names[k]); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- Game flow ---------- */
function updateUI(){
  $("n1").textContent=S.names[0]; $("n2").textContent=S.names[1];
  $("s1").textContent=S.score[0]; $("s2").textContent=S.score[1];
  $("roundLbl").textContent = S.qs.length ? `FRÅGA ${S.i+1}/${S.qs.length}` : "–";
  const q=S.qs[S.i]; const btn=$("action");
  $("place").textContent = q ? q[0] : "…";
  btn.className="btn";
  if(!q){ btn.disabled=true; return; }
  renderClue(q);
  if(S.phase==="guess"){
    $("sub").hidden=true; $("legend").hidden=true;
    const nm=esc(S.names[S.turn]);
    $("msg").innerHTML = S.pins[S.turn]
      ? `<b>${nm}</b>: tryck igen för att flytta pilen, eller lås den.`
      : `<b>${nm}</b>: tryck på kartan där du tror att det ligger. Nyp för att zooma.`;
    btn.textContent="Lås pilen"; btn.classList.add(S.turn?"p2":"p1");
    btn.disabled=!S.pins[S.turn];
  } else {
    $("sub").hidden=false;
    if(S.kinds[S.i]==="bild" && S.pic){
      $("sub").innerHTML=`${esc(q[1])} · Bilden: ${esc(S.pic.cap)} (<a href="${esc(S.pic.url)}" target="_blank" rel="noopener">Wikipedia</a>)`;
    } else $("sub").textContent=q[1];
    const d=[0,1].map(k=>dist(S.pins[k],[q[3],q[2]]));
    const w = Math.abs(d[0]-d[1])<0.05 ? -1 : (d[0]<d[1]?0:1);
    $("msg").innerHTML = w<0
      ? `Lika nära! Båda får en poäng.`
      : `<b>${esc(S.names[w])}</b> var närmast – ${fmtKm(d[w])} bort. ${esc(S.names[1-w])}: ${fmtKm(d[1-w])}.`;
    const lg=$("legend"); lg.hidden=false;
    lg.innerHTML=[0,1].map(k=>`<div class="row${w===k||w<0?" win":""}"><span class="sw" style="background:${COLORS[k]}"></span><span class="nm2">${esc(S.names[k])}${w===k?" ✓":""}</span><span class="km">${fmtKm(d[k])}</span></div>`).join("")
      + `<div class="row"><span class="tgt"></span><span>${esc(q[0])}</span></div>`;
    btn.textContent = S.i+1<S.qs.length ? "Nästa fråga" : "Se resultat";
    btn.disabled=false;
  }
}
function renderClue(q){
  const asPic = S.kinds[S.i]==="bild" && S.pic!==false; // false = no picture found
  const pic=$("pic");
  if(!asPic){
    pic.hidden=true; $("place").hidden=false;
    $("lbl").textContent = S.kinds[S.i]==="bild" ? "Ingen bild hittades – var ligger" : "Var ligger";
    return;
  }
  if(S.phase==="guess"){
    $("lbl").textContent="Var ligger det här?"; $("place").hidden=true;
  } else { $("lbl").textContent="Det var"; $("place").hidden=false; }
  pic.hidden=false;
  if(S.pic){
    if(!pic.querySelector("img") || pic.querySelector("img").getAttribute("src")!==S.pic.src)
      pic.innerHTML=`<img src="${esc(S.pic.src)}" alt="Bildledtråd"><span class="hint">Tryck för större bild</span>`;
  } else pic.innerHTML="Hämtar bild…";
}
function loadPicFor(i){
  S.pic=null;
  if(S.kinds[i]!=="bild") return;
  const q=S.qs[i];
  getPic(q).then(r=>{ if(S.qs[S.i]!==q) return; S.pic = r || false; updateUI(); });
  // warm up the next one
  if(S.qs[i+1] && S.kinds[i+1]==="bild") getPic(S.qs[i+1]);
}
$("pic").onclick=()=>{ if(!S.pic) return; $("picFull").innerHTML=`<img src="${esc(S.pic.src)}" alt="">`; $("picFull").hidden=false; };
$("picFull").onclick=()=>{ $("picFull").hidden=true; };
function lockPin(){
  S.locked[S.turn]=true;
  const other=1-S.turn;
  if(!S.locked[other]){
    S.turn=other;
    if(S.hide){
      $("handName").textContent=S.names[other];
      $("handBtn").className="btn "+(other?"p2":"p1");
      $("handScr").hidden=false;
    }
    drawPins(); updateUI();
  } else reveal();
}
function reveal(){
  const q=S.qs[S.i]; S.phase="reveal";
  const d=[0,1].map(k=>dist(S.pins[k],[q[3],q[2]]));
  S.km[0]+=d[0]; S.km[1]+=d[1];
  if(Math.abs(d[0]-d[1])<0.05){S.score[0]++;S.score[1]++;}
  else S.score[d[0]<d[1]?0:1]++;
  // Frame all three points
  const pts=[S.pins[0],S.pins[1],[q[3],q[2]]].map(p=>projection(p)).filter(Boolean);
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const bw=Math.max(...xs)-Math.min(...xs), bh=Math.max(...ys)-Math.min(...ys);
  const k=Math.max(1,Math.min(zoom.scaleExtent()[1], 0.55/Math.max(bw/W,bh/H,1e-6)));
  const cx=(Math.max(...xs)+Math.min(...xs))/2, cy=(Math.max(...ys)+Math.min(...ys))/2;
  const t=d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-cx,-cy);
  drawArcs(); drawPins(); updateUI();
  svg.transition().duration(900).call(zoom.transform,t);
}
function nextQ(){
  if(S.i+1>=S.qs.length){ showEnd(); return; }
  S.i++; S.starter=1-S.starter; S.turn=S.starter;
  S.pins=[null,null]; S.locked=[false,false]; S.phase="guess";
  loadPicFor(S.i);
  drawArcs(); drawPins(); updateUI();
  svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity);
}
function showEnd(){
  const [a,b]=S.score;
  let w = a===b ? (S.km[0]===S.km[1]?-1:(S.km[0]<S.km[1]?0:1)) : (a>b?0:1);
  $("winner").innerHTML = w<0 ? "Oavgjort!" : `${esc(S.names[w])}<br>vinner!` + (a===b?`<small>Lika poäng – avgjort på minst antal kilometer totalt.</small>`:"");
  $("winner").style.color = w<0?"var(--sign)":COLORS[w];
  [0,1].forEach(k=>{
    $("e"+(k+1)+"n").textContent=S.names[k];
    $("e"+(k+1)+"v").textContent=S.score[k]+" p";
    $("e"+(k+1)+"k").textContent="Totalt "+fmtKm(S.km[k])+" fel, snitt "+fmtKm(S.km[k]/S.qs.length);
  });
  $("endScr").hidden=false;
}
function startGame(){
  S.names=[$("in1").value.trim()||"Lag 1",$("in2").value.trim()||"Lag 2"];
  S.hide=$("hide").checked;
  S.score=[0,0]; S.km=[0,0]; S.i=0; S.starter=0; S.turn=0;
  S.pins=[null,null]; S.locked=[false,false]; S.phase="guess";
  S.qs=shuffle(Q[S.mode]).slice(0,S.n);
  S.kinds=S.qs.map((q,i)=> S.clue==="blandat" ? (i%2?"bild":"namn") : S.clue);
  if(S.clue!=="namn") S.qs.forEach((q,i)=>{ if(S.kinds[i]==="bild") getPic(q); });
  loadPicFor(0);
  $("startScr").hidden=true; $("endScr").hidden=true;
  buildMap(); updateUI();
}

$("action").onclick=()=>{ if(S.phase==="guess") lockPin(); else nextQ(); };
$("handBtn").onclick=()=>{ $("handScr").hidden=true; };
$("startBtn").onclick=startGame;
$("againBtn").onclick=()=>{ $("endScr").hidden=true; $("startScr").hidden=false; };
function seg(id,key,num){
  $(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{
    $(id).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
    S[key]=num?+b.dataset.v:b.dataset.v;
  });
}

/* ---------- Init ---------- */
const SOURCES=[
  "https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/world.js",
  "https://unpkg.com/echarts@4.9.0/map/js/world.js",
  "https://cdn.jsdelivr.net/npm/echarts@4.8.0/map/js/world.js"
];
function loadScript(src){
  return new Promise((ok,fail)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=fail; document.head.appendChild(s); });
}
async function loadWorld(){
  for(const src of SOURCES){
    try{ await loadScript(src); if(window.__geo) return toRings(decodeGeo(window.__geo)); }catch(e){}
  }
  return null;
}
// Sample state behind the start screen

$("mapnote").hidden=false; $("mapnote").textContent="Laddar kartan…";
loadWorld().then(r=>{
  world=r;
  if(world){ $("mapnote").hidden=true; }
  else $("mapnote").textContent="Kartbilden kunde inte laddas, så bara gradnätet visas. Spelet fungerar ändå – avstånden räknas som vanligt.";
  buildMap();
  if(S.phase==="reveal"){drawArcs();drawPins();}
});
})();
