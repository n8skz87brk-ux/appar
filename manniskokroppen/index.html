<style>
/* Layout: one column — settings, then a sticky question card floating over a lightbox plate of the body */
:root{
  --film:#0b1317; --film-2:#16262e; --panel:rgba(15,28,34,.92);
  --text:#e6eef0; --muted:#8fa6ad; --rule:rgba(143,166,173,.25); --skin:rgba(200,225,232,.07);
  --bone:#dbe7ea; --edge:#6f8b93;
  --muscle:#d98a78; --artery:#ff6e6e; --vein:#6fa6ff;
  --brain:#e9b9c4; --eye:#eef3f4; --gland:#f0a35e; --airway:#a9d3e0; --lung:#e9a7b4; --heart:#e2574c;
  --liver:#b8614f; --bile:#9fcf6a; --stomach:#e7b08f; --spleen:#a77bbd; --pancreas:#f2cf8a; --kidney:#b85a66;
  --gut:#d9b38c; --gut2:#e8c9a6; --bladder:#e6d27a;
  --ok:#6fdc9c; --miss:#ff8b6e; --mark:#f5d565;
  --display:"Spectral", Georgia, "Times New Roman", serif;
  --ui:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{background:var(--film)}
body{
  color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--film)}
.wrap{max-width:480px;margin:0 auto;padding-block:14px 36px;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--display);font-weight:500;font-size:1.7rem;margin:0;letter-spacing:.01em;text-wrap:balance}
.setup{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.lbl{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.opt{appearance:none;border:1px solid var(--rule);background:transparent;color:var(--muted);font:600 .84rem var(--ui);padding:7px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.opt[aria-pressed="true"]{background:var(--bone);border-color:var(--bone);color:var(--film)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sw)}
.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.card{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:var(--panel);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid var(--rule);border-radius:14px;padding:12px 14px;
  display:flex;flex-direction:column;gap:4px;
}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.latin{font-family:var(--display);font-style:italic;font-weight:600;font-size:2rem;line-height:1.12;min-height:1.12em;overflow-wrap:anywhere;text-wrap:balance}
.fb{font-size:.95rem;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.miss{color:var(--miss)}
.fb small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.actions:empty{display:none}
.btn{appearance:none;border:0;border-radius:10px;padding:10px 16px;font:600 .95rem var(--ui);cursor:pointer;background:var(--mark);color:#1b1606}
.plate{background:radial-gradient(ellipse at 50% 30%, var(--film-2), var(--film) 78%);border:1px solid var(--rule);border-radius:16px;padding-block:6px}
svg{display:block;width:100%;height:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
.skin{fill:var(--skin);stroke:var(--rule);stroke-width:.8;pointer-events:none}
.layer{transition:opacity .25s}
.layer.ghost{opacity:.13;pointer-events:none}
.layer[data-sys="skelett"]{filter:drop-shadow(0 0 2.4px rgba(190,225,232,.35))}
.layer[data-sys="muskler"] .b{fill-opacity:.82}
g[data-id]{--c:var(--bone)}
.b{fill:var(--c);fill-opacity:.88;stroke:var(--film);stroke-opacity:.6;stroke-width:.6;cursor:pointer;transition:fill .2s}
.bs{fill:none;stroke:var(--c);stroke-opacity:.92;stroke-linecap:round;stroke-linejoin:round;cursor:pointer;transition:stroke .2s}
.layer[data-sys="skelett"] .b{stroke:var(--edge)}
.hole{fill:var(--film);stroke:var(--edge);stroke-width:.4;pointer-events:none}
.seam{stroke:var(--film);stroke-width:.8;stroke-opacity:.7;fill:none;pointer-events:none}
.ctx{fill:none;stroke:var(--muted);stroke-width:.8;stroke-dasharray:2 2;pointer-events:none}
g.ok .b{fill:var(--ok);fill-opacity:1} g.ok .bs{stroke:var(--ok);stroke-opacity:1}
g.show .b{fill:var(--mark);fill-opacity:1} g.show .bs{stroke:var(--mark);stroke-opacity:1}
g.miss .b{fill:var(--film-2);fill-opacity:1;stroke:var(--miss);stroke-width:1.4;stroke-opacity:1}
g.miss .bs{stroke:var(--miss);stroke-dasharray:3 2;stroke-opacity:1}
g.pulse{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{opacity:.35}}
g.lm{opacity:0;pointer-events:none;transition:opacity .2s}
.layer.showlm g.lm{opacity:.45}
g.lm.ok,g.lm.show,g.lm.miss{opacity:1}
.ring{fill:none;stroke:var(--mark);stroke-width:1.5}
.ringdot{fill:var(--mark)}
g.lm.ok .ring{stroke:var(--ok)} g.lm.ok .ringdot{fill:var(--ok)}
g.lm.miss .ring{stroke:var(--miss)} g.lm.miss .ringdot{fill:var(--miss)}
.tap{fill:none;stroke:var(--mark);stroke-width:1.3;pointer-events:none}
.tapdot{fill:var(--mark);pointer-events:none}
.marker{font:700 9px var(--ui);letter-spacing:.12em;fill:var(--muted)}
.foot{color:var(--muted);font-size:.82rem;margin:0}
@media (prefers-reduced-motion:reduce){g.pulse{animation:none}.b,.bs,.layer{transition:none}}
</style>

<div class="wrap">
  <h1>Människokroppen</h1>

  <section class="setup" aria-label="Inställningar">

  </div>
  <p class="foot">Kroppen visas framifrån. Delar som finns på båda sidor räknas rätt oavsett sida. DX och SIN är personens högra och vänstra sida, som på en röntgenbild.</p>

for(const k in LM)for(const [id,la,sv,pt,pair] of LM[k])ITEMS[k].push({id,la,sv,lvl:3,pt,pair:!!pair});
const ALL=[];const byId={};
for(const s of SYSTEMS)for(const it of ITEMS[s.key]){it.sys=s.key;byId[it.id]=it;if(it.q!==false)ALL.push(it);}

/* ---------- render ---------- */
const svg=document.getElementById("sk"),base=document.getElementById("base"),layersG=document.getElementById("layers"),taps=document.getElementById("taps");
function el(name,attrs,parent){const e=document.createElementNS(NS,name);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;}
function drawShape(s,g,mirror,forceCls){
  let e;
  if(s.t==="path")e=el("path",{d:mirror?mx(s.d):s.d},g);
  else if(s.t==="ellipse")e=el("ellipse",{cx:mirror?W-s.cx:s.cx,cy:s.cy,rx:s.rx,ry:s.ry},g);
  else if(s.t==="circle")e=el("circle",{cx:mirror?W-s.cx:s.cx,cy:s.cy,r:s.r},g);
  else if(s.t==="rect")e=el("rect",{x:mirror?W-s.x-s.w:s.x,y:s.y,width:s.w,height:s.h,rx:s.rx},g);
  if(forceCls)e.setAttribute("class",forceCls);
  else if(s.cls)e.setAttribute("class",s.cls);
  else if(s.s){e.setAttribute("class","bs");e.setAttribute("stroke-width",s.s);e.dataset.s=s.s;}
  else e.setAttribute("class","b");
}
// body silhouette
const SKIN=["M 150 100 L 137 102 L 137 128 C 124 134 108 138 98 146 L 104 200 L 110 250 C 106 280 98 300 98 330 L 100 380 C 102 420 104 450 103 482 C 99 520 98 560 100 600 L 98 640 C 100 656 114 658 136 655 L 134 600 C 132 560 136 520 136 486 C 138 440 142 400 146 380 L 150 377 Z",
 "M 99 142 C 88 140 79 148 76 166 L 62 250 L 51 340 C 45 352 39 374 37 396 C 37 412 44 421 52 421 L 64 421 C 72 419 83 410 85 392 L 87 360 L 90 340 L 97 262 L 107 200 Z"];

  const lg=el("g",{class:"layer","data-sys":s.key},layersG);layerEls[s.key]=lg;
  for(const it of ITEMS[s.key]){
    if(it.pt){
      it.P=[it.pt];if(it.pair)it.P.push([W-it.pt[0],it.pt[1]]);
      const g=el("g",{"data-lm":it.id,class:"lm"},lg);groups[it.id]=g;
      for(const [x,y] of it.P){el("circle",{cx:x,cy:y,r:4.5,class:"ring"},g);el("circle",{cx:x,cy:y,r:1.3,class:"ringdot"},g);}
      continue;
    }
    const g=el("g",{"data-id":it.id},lg);groups[it.id]=g;
    if(it.c)g.style.setProperty("--c",`var(${it.c})`);
    for(const sh of it.shapes){drawShape(sh,g,false);if(it.pair)drawShape(sh,g,true);}
  }
  for(const sh of (CTX[s.key]||[])){drawShape(sh,lg,false,"ctx");if(sh.pair)drawShape(sh,lg,true,"ctx");}
  if(s.key==="skelett"){el("ellipse",{cx:136,cy:56,rx:10,ry:9,class:"hole"},lg);el("ellipse",{cx:164,cy:56,rx:10,ry:9,class:"hole"},lg);}
}
const m1=el("text",{x:42,y:658,class:"marker"},base);m1.textContent="DX";

/* ---------- geometry ---------- */
function toSvg(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function distTo(p,id){
  let best=Infinity;
  if(byId[id].P){for(const [x,y] of byId[id].P)best=Math.min(best,Math.hypot(p.x-x,p.y-y));return best;}
  for(const c of groups[id].children){
    const cl=c.getAttribute("class");if(cl!=="b"&&cl!=="bs")continue;
    const bb=c.getBBox(),pad=c.dataset.s?c.dataset.s/2:0;
    const dx=Math.max(bb.x-pad-p.x,0,p.x-(bb.x+bb.width+pad)),dy=Math.max(bb.y-pad-p.y,0,p.y-(bb.y+bb.height+pad));
    best=Math.min(best,Math.hypot(dx,dy));
  }
  return best;
}
function nearest(p,max,pool){let id=null,d=max;for(const it of pool){const v=distTo(p,it.id);if(v<=d){d=v;id=it.id;}}return id;}

/* ---------- state + settings ---------- */
const $=id=>document.getElementById(id);
const metaL=$("metaL"),metaR=$("metaR"),latin=$("latin"),fb=$("fb"),actions=$("actions");
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cfg=store.get("mk-cfg",{mode:"play",sys:["skelett","muskler","organ","blodkarl"],lvl:1});
if(!cfg.learn)cfg.learn=cfg.sys[0]||"skelett";
let qs=[],idx=0,score=0,locked=false,missed=[],timer=null,finished=false;

const sysOpts=$("sysOpts");
for(const s of SYSTEMS){
  const b=document.createElement("button");b.className="opt";b.id="sys-"+s.key;b.style.setProperty("--sw",s.sw);
  b.innerHTML=`<span class="dot"></span>${s.name}`;
  b.addEventListener("click",()=>{
    if(cfg.mode==="learn"){cfg.learn=s.key;apply();return;}
    const on=cfg.sys.includes(s.key);
    if(on&&cfg.sys.length===1)return;
    cfg.sys=on?cfg.sys.filter(k=>k!==s.key):SYSTEMS.map(x=>x.key).filter(k=>k===s.key||cfg.sys.includes(k));
    apply();
  });
  sysOpts.appendChild(b);
}
$("mode-play").addEventListener("click",()=>{cfg.mode="play";apply();});
$("mode-learn").addEventListener("click",()=>{cfg.mode="learn";apply();});
$("lvl-1").addEventListener("click",()=>{cfg.lvl=1;apply();});
$("lvl-2").addEventListener("click",()=>{cfg.lvl=2;apply();});
$("lvl-3").addEventListener("click",()=>{cfg.lvl=3;apply();});

function pool(){const sys=cfg.mode==="learn"?[cfg.learn]:cfg.sys;return ALL.filter(it=>sys.includes(it.sys)&&(cfg.lvl===3?it.lvl===3:(it.lvl||1)<=cfg.lvl));}
function sysName(k){return SYSTEMS.find(s=>s.key===k).name;}
function cfgKey(){return "mk-best-"+cfg.sys.slice().sort().join("+")+"-"+cfg.lvl;}

function showLayers(active){ // active: array of system keys that are tappable
  for(const s of SYSTEMS){
    const lg=layerEls[s.key],on=active.includes(s.key);
    lg.style.display=on?"":"none";lg.classList.remove("ghost");lg.classList.toggle("showlm",on&&cfg.mode==="learn"&&cfg.lvl===3);
  }
}
function apply(){
  store.set("mk-cfg",cfg);
  $("mode-play").setAttribute("aria-pressed",cfg.mode==="play");$("mode-learn").setAttribute("aria-pressed",cfg.mode==="learn");
  $("lvl-1").setAttribute("aria-pressed",cfg.lvl===1);$("lvl-2").setAttribute("aria-pressed",cfg.lvl===2);$("lvl-3").setAttribute("aria-pressed",cfg.lvl===3);
  for(const s of SYSTEMS)$("sys-"+s.key).setAttribute("aria-pressed",cfg.mode==="learn"?cfg.learn===s.key:cfg.sys.includes(s.key));
  cfg.mode==="play"?newGame():learnIntro();
}

/* ---------- UI ---------- */
function clearMarks(){for(const id in groups)groups[id].classList.remove("ok","miss","show","pulse");taps.innerHTML="";}
function markTap(p){el("circle",{cx:p.x,cy:p.y,r:5,class:"tap"},taps);el("circle",{cx:p.x,cy:p.y,r:1.2,class:"tapdot"},taps);}
function button(label,fn){const b=document.createElement("button");b.className="btn";b.textContent=label;b.addEventListener("click",fn);actions.appendChild(b);return b;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const cap=s=>s[0].toUpperCase()+s.slice(1);

function newGame(){const pl=pool();qs=shuffle(pl).slice(0,Math.min(ROUNDS,pl.length));idx=0;score=0;missed=[];finished=false;ask();}
function ask(){
  clearTimeout(timer);clearMarks();locked=false;actions.innerHTML="";
  const t=qs[idx];showLayers([t.sys]);
  metaL.textContent=`${sysName(t.sys)} · ${idx+1} av ${qs.length}`;metaR.textContent=`Poäng ${score}`;
  latin.textContent=t.la;fb.className="fb";fb.textContent=SYSTEMS.find(s=>s.key===t.sys).q;
}
function next(){clearTimeout(timer);if(idx+1>=qs.length)finish();else{idx++;ask();}}
function answer(p,hit){
  const t=qs[idx];locked=true;markTap(p);
  const right=t.P?(hit===t.id||distTo(p,t.id)<=3.5):(hit===t.id||(!hit&&distTo(p,t.id)<=TOL));
  if(right){
    score++;groups[t.id].classList.add("ok");
    fb.className="fb ok";fb.textContent=`Rätt! ${t.la} är ${t.sv}.`;
  }else{
    missed.push(t);
    if(hit)groups[hit].classList.add("miss");
    groups[t.id].classList.add("ok","pulse");
    fb.className="fb miss";
    fb.innerHTML=`Fel – ${t.la} är ${t.sv}, markerad i grönt.`+(hit?`<small>Du tryckte på ${byId[hit].la} (${byId[hit].sv}).</small>`:"");
  }
  metaR.textContent=`Poäng ${score}`;actions.innerHTML="";
  button(idx+1>=qs.length?"Se resultat":"Nästa",next).focus({preventScroll:true});
  if(right)timer=setTimeout(next,1600);
}
function finish(){
  finished=true;clearMarks();actions.innerHTML="";
  const n=qs.length,b=store.get(cfgKey(),0),rec=score>b;if(rec)store.set(cfgKey(),score);
  const lastSys=qs[n-1].sys;showLayers([lastSys]);
  metaL.textContent="Resultat";metaR.textContent=`Rekord ${Math.max(b,score)} av ${n}`;
  latin.textContent=`${score} av ${n} rätt`;fb.className="fb";
  let msg=score===n?"Fullpott.":score>=0.7*n?"Bra jobbat.":score>=0.4*n?"Godkänt, men det finns mer att lära.":"Prova läget Lär dig och kör en gång till.";
  if(rec&&b>0)msg="Nytt rekord! "+msg;
  fb.innerHTML=msg+(missed.length?`<small>Öva mer på: ${missed.map(m=>`${m.la} (${m.sv})`).join(", ")}</small>`:"");
  missed.filter(m=>m.sys===lastSys).forEach(m=>groups[m.id].classList.add("miss"));
  button("Spela igen",newGame);
}
function learnIntro(){
  clearTimeout(timer);clearMarks();actions.innerHTML="";finished=false;
  showLayers([cfg.learn]);
  metaL.textContent="Lär dig · "+sysName(cfg.learn);metaR.textContent=`${pool().length} delar`;
  latin.textContent="Tryck på en del";fb.className="fb";fb.textContent="Namnet visas på latin och svenska. Byt system ovan.";
}

svg.addEventListener("click",e=>{
  const p=toSvg(e);const g=e.target.closest&&e.target.closest("g[data-id]");
  let hit=g?g.dataset.id:null;if(hit&&byId[hit].q===false)hit=null;
  if(cfg.mode==="learn"){
    const pl=pool();let id=cfg.lvl===3?nearest(p,LMTOL,pl):null;
    if(!id){const bp=cfg.lvl===3?ALL.filter(it=>it.sys===cfg.learn&&!it.P):pl;id=(hit&&bp.includes(byId[hit]))?hit:nearest(p,TOL,bp);}
    clearMarks();
    if(!id){latin.textContent="Tryck på en del";fb.textContent=hit?"Den delen ingår bara på nivån Svår.":"Inget just där – prova igen.";return;}
    const it=byId[id];groups[id].classList.add("show");
    latin.textContent=it.la;fb.className="fb";fb.textContent=`${cap(it.sv)} · ${sysName(it.sys)}`;
    return;
  }
  if(locked||finished||!qs.length)return;
  const t=qs[idx];
  if(t.P){const lm=nearest(p,LMTOL,ALL.filter(it=>it.P&&it.sys===t.sys));if(lm)hit=lm;}
  answer(p,hit);
});

apply();
})();
