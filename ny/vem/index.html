html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;

.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.01em;margin:0;text-wrap:balance}
.ver{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:26px 24px 28px;margin-bottom:30px}
.bubble::before,.bubble::after{content:"";position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:50%}
.bubble::before{width:22px;height:22px;left:44px;bottom:-30px}
.bubble::after{width:12px;height:12px;left:30px;bottom:-48px}
.label{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.q{font-family:var(--display);font-weight:700;font-size:clamp(1.45rem,5.5vw,1.9rem);line-height:1.2;margin:10px 0 0;text-wrap:balance}
.sub{color:var(--muted);margin:10px 0 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers .wide{grid-column:1 / -1}
button{font:inherit;cursor:pointer;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:14px 12px;font-weight:600;transition:transform .08s ease, background .15s}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.big{font-family:var(--display);font-size:1.25rem;padding:18px 12px}
.yes{background:var(--yes);border-color:var(--yes);color:#fff}
.no{background:var(--no);border-color:var(--no);color:#fff}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:1.15rem;padding:16px}
.soft{color:var(--muted);font-weight:500}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tools button{background:transparent;border-color:transparent;color:var(--muted);font-weight:500;padding:8px 12px;text-decoration:underline;text-underline-offset:3px}
.tools button:disabled{opacity:.4;cursor:default}
.guessname{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.1;margin:8px 0 0;text-wrap:balance}
input[type=text]{font:inherit;width:100%;box-sizing:border-box;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:14px}

.trail{font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}

details{color:var(--muted);font-size:.9rem}
summary{cursor:pointer}
@media (prefers-reduced-motion: reduce){button{transition:none}}

const has = t => p => p.t.has(t);
const Q = [
 ["k","Är det en kvinna?",has("k")],
 ["lev","Lever personen idag?",has("lev")],

// Svar: [vikt om personen HAR egenskapen, vikt om den INTE har den]
const A = {
  ja:[1,.03], troligen:[1,.3], vetinte:[1,1], troligeninte:[.3,1], nej:[.03,1]
};
const ANS_LABEL = {ja:"Ja",troligen:"Troligen",vetinte:"Vet inte",troligeninte:"Troligen inte",nej:"Nej"};
const MAX_Q = 25;

let S, hist;
function fresh(){
  S = {view:"start", w:P.map(()=>1), asked:[], answers:[], guessed:[], guess:null, qn:0, cur:null};
  hist = [];
}
const clone = o => JSON.parse(JSON.stringify(o));

function probs(){
  const tot = S.w.reduce((a,b)=>a+b,0) || 1;
  return S.w.map(x=>x/tot);
}
function H(p){ return p<=0||p>=1 ? 0 : -(p*Math.log2(p)+(1-p)*Math.log2(1-p)); }

function bestQuestion(){
  const pr = probs();
  let scored = [];
  for(const q of Q){
    if(S.asked.includes(q.id)) continue;
    let p=0; P.forEach((x,i)=>{ if(q.f(x)) p+=pr[i]; });
    // Frågor där nästan alla kvarvarande svarar lika har fallit bort
    if(p<0.02 || p>0.98) continue;
    scored.push({q, s:H(p)});
  }
  if(!scored.length) return null;
  scored.sort((a,b)=>b.s-a.s);
  const top = scored.filter(x=>x.s >= scored[0].s-0.03);
  return top[Math.floor(Math.random()*top.length)].q;
}
function topCandidate(){
  const pr = probs();
  let bi=-1,bp=0;
  pr.forEach((p,i)=>{ if(!S.guessed.includes(i) && p>bp){bp=p;bi=i;} });
  return {i:bi,p:bp};
}
function aliveCount(){ return probs().filter(p=>p>0.005).length; }

function next(){
  const t = topCandidate();
  const q = bestQuestion();
  if(t.i<0){ S.view="giveup"; return render(); }
  const sure = t.p>=0.7 && S.qn>=4;
  if(sure || !q || S.qn>=MAX_Q || (S.qn>=20 && S.guessed.length===0)){
    if(S.qn>=MAX_Q && S.guessed.length>=3){ S.view="giveup"; return render(); }
    S.guess=t.i; S.view="guess"; return render();
  }
  S.cur=q.id; S.view="question"; render();
}

function answer(key){
  hist.push(clone(S));
  const q = Q.find(x=>x.id===S.cur);
  const [wy,wn] = A[key];
  S.w = S.w.map((w,i)=> w*(q.f(P[i])?wy:wn));
  S.asked.push(q.id); S.answers.push([q.text,key]); S.qn++;
  next();
}
function guessWrong(){
  hist.push(clone(S));
  S.w[S.guess]=0; S.guessed.push(S.guess); S.guess=null;
  if(S.guessed.length>=3 && S.qn>=20){ S.view="giveup"; return render(); }
  next();
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const app = $("app");
  $("undo").disabled = hist.length===0;
  if(S.view==="start"){
    app.innerHTML = `
      <div class="bubble">
        <div class="label"><span>Så här går det till</span></div>
        <p class="q">Tänk på en känd person. Jag ställer frågor och försöker gissa vem.</p>
        <p class="sub">Levande eller död, svensk eller utländsk. Varje svar sållar bort frågor som inte längre passar. Jag känner till ${P.length} personer.</p>
      </div>
      <button class="primary" id="go" type="button">Jag tänker på någon</button>
      ${missingHTML()}`;
    $("go").onclick = ()=>{ hist=[]; next(); };
    wireMissing();
  }
  else if(S.view==="question"){
    const q = Q.find(x=>x.id===S.cur);
    app.innerHTML = `
      <div class="bubble">
        <div class="label"><span>Fråga ${S.qn+1}</span><span>${aliveCount()} möjliga kvar</span></div>
        <p class="q">${esc(q.text)}</p>
      </div>
      <div class="answers">
        <button class="big yes" data-a="ja" type="button">Ja</button>
        <button class="big no" data-a="nej" type="button">Nej</button>
        <button data-a="troligen" type="button">Troligen</button>
        <button data-a="troligeninte" type="button">Troligen inte</button>
        <button class="wide soft" data-a="vetinte" type="button">Vet inte</button>
      </div>`;
    app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>answer(b.dataset.a));
  }
  else if(S.view==="guess"){
    const p = P[S.guess];
    app.innerHTML = `
      <div class="bubble">
        <div class="label"><span>Efter ${S.qn} frågor</span><span>Gissning ${S.guessed.length+1}</span></div>
        <p class="sub" style="margin-top:12px">Jag tror att du tänker på …</p>
        <p class="guessname">${esc(p.name)}</p>
        <p class="sub">${esc(p.desc)}</p>
      </div>
      <div class="answers">
        <button class="big yes" id="right" type="button">Ja, rätt!</button>
        <button class="big no" id="wrong" type="button">Nej</button>
      </div>`;
    $("right").onclick = ()=>{ S.view="won"; render(); };
    $("wrong").onclick = guessWrong;
  }
  else if(S.view==="won"){
    const p = P[S.guess];
    app.innerHTML = `
      <div class="bubble">
        <div class="label"><span>Rätt gissat</span></div>
        <p class="guessname">${esc(p.name)}</p>
        <p class="sub">Klart på ${S.qn} frågor${S.guessed.length?` och ${S.guessed.length+1} gissningar`:""}.</p>
      </div>
      <button class="primary" id="again" type="button">Spela igen</button>
      ${trailHTML()}`;
    $("again").onclick = ()=>{ fresh(); next(); };
  }
  else if(S.view==="giveup"){
    app.innerHTML = `
      <div class="bubble">
        <div class="label"><span>Jag ger upp</span></div>
        <p class="q">Vem tänkte du på?</p>
        <p class="sub">Skriv namnet så sparas det i listan över personer jag borde lära mig.</p>
        <input type="text" id="who" placeholder="Namn" autocomplete="off">
      </div>
      <button class="primary" id="save" type="button">Spara och spela igen</button>
      ${trailHTML()}`;
    $("save").onclick = ()=>{
      const n = $("who").value.trim();
      if(n) addMissing(n);
      fresh(); render();
    };
  }
}

function trailHTML(){
  if(!S.answers.length) return "";
  return `<details><summary>Dina svar</summary><div class="trail" style="margin-top:10px">${
    S.answers.map(([t,a])=>`<span class="chip">${esc(t)} <b>${ANS_LABEL[a]}</b></span>`).join("")
  }</div></details>`;
}

// Personer appen inte kände till – sparas bara i den här webbläsaren
const KEY="vemtankerdupa.saknade";
function getMissing(){ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } }
function addMissing(n){ try{ const l=getMissing(); if(!l.includes(n)) l.push(n); localStorage.setItem(KEY,JSON.stringify(l)); }catch(e){} }
function missingHTML(){
  const l=getMissing(); if(!l.length) return "";
  return `<details><summary>Personer jag inte kunde gissa (${l.length})</summary>
    <ul class="list" style="margin-top:8px">${l.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>
    <div class="tools" style="justify-content:flex-start;margin-top:6px">
      <button id="copym" type="button">Kopiera listan</button><button id="clearm" type="button">Töm listan</button>
    </div></details>`;
}
function wireMissing(){
  const c=$("copym"), d=$("clearm");
  if(c) c.onclick=()=>{ const t=getMissing().join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>c.textContent="Kopierat",()=>c.textContent="Kunde inte kopiera"); };
  if(d) d.onclick=()=>{ if(d.dataset.sure){ try{localStorage.removeItem(KEY);}catch(e){} render(); } else { d.dataset.sure=1; d.textContent="Tryck igen för att tömma"; } };
}

$("undo").onclick = ()=>{ if(hist.length){ S=hist.pop(); render(); } };
$("restart").onclick = ()=>{ fresh(); render(); };
fresh(); render();
</script>
