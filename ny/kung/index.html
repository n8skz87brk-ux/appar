<title>Vem var kung när…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

</head><body>
<style>
/* Layout: one narrow column, a "kort" with the event, four choices beneath, regentlängd as a slide-down ledger */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#14213d; --muted:#5b6782; --line:#d5dbe7;
  --royal:#1d3a7a; --gold:#b8862b; --gold-soft:#f3e6c8;
  --ok:#1f7a4d; --ok-bg:#dff1e7; --bad:#a83232; --bad-bg:#f6e0e0;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --body:"Libre Franklin", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1424; --surface:#16203a; --ink:#e7ebf4; --muted:#9aa6c2; --line:#2a3656;
  --royal:#8fb0ff; --gold:#e0b35a; --gold-soft:#3a2f17;
  --ok:#6fd3a0; --ok-bg:#163a2a; --bad:#f08c8c; --bad-bg:#3d1c1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1424; --surface:#16203a; --ink:#e7ebf4; --muted:#9aa6c2; --line:#2a3656;
  --royal:#8fb0ff; --gold:#e0b35a; --gold-soft:#3a2f17;
  --ok:#6fd3a0; --ok-bg:#163a2a; --bad:#f08c8c; --bad-bg:#3d1c1f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:1.65rem;letter-spacing:.02em;margin:0;color:var(--royal);text-wrap:balance}
h1 span{color:var(--gold)}
.stats{display:flex;gap:14px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.ok{background:var(--ok)} .progress i.bad{background:var(--bad)} .progress i.now{background:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 var(--line)}
.year{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.year.hidden{font-size:1rem;color:var(--muted);font-family:var(--body);letter-spacing:.08em;text-transform:uppercase}
.event{font-size:1.2rem;font-weight:500;text-wrap:balance}
.q{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.choices{grid-template-columns:1fr}}
.choice{font:inherit;font-weight:600;text-align:left;padding:14px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:56px;display:flex;flex-direction:column;justify-content:center}
.choice small{font-weight:400;color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
.choice:hover:not(:disabled){border-color:var(--royal)}
.choice:focus-visible,.btn:focus-visible,.toggle:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.bad{border-color:var(--bad);background:var(--bad-bg)}
.choice:disabled{cursor:default}
.feedback{font-size:.95rem;padding:12px 14px;border-radius:10px;background:var(--gold-soft)}
.feedback b{font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{font:inherit;font-weight:600;padding:12px 18px;border-radius:10px;border:none;background:var(--royal);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--royal);border:1.5px solid var(--line)}
.toggle{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--royal)}
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 14px}
.ledger h2{font-family:var(--display);font-size:1.05rem;margin:0 0 10px;color:var(--royal);letter-spacing:.04em}
.ledger ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ledger li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 2px;border-top:1px solid var(--line);font-size:.92rem}
.ledger li:first-child{border-top:none}
.ledger .yrs{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
.ledger .bar{grid-column:1/-1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.ledger .bar span{display:block;height:100%;background:var(--gold)}
.ledger li.hl{background:var(--gold-soft);border-radius:6px}
.final{text-align:center;align-items:center}
.final .big{font-family:var(--display);font-size:3rem;color:var(--gold);line-height:1}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap">
  <header>
    <h1>Vem var kung <span>när…</span></h1>
    <div class="stats"><span>Rätt <b id="score">0</b>/<b id="asked">0</b></span><span>Rekord <b id="best">–</b></span></div>
  </header>
  <div class="progress" id="progress"></div>
  <div id="stage"></div>
  <div class="row">
    <label class="toggle"><input type="checkbox" id="showYear" checked> Visa årtal</label>
    <button class="btn ghost" id="ledgerBtn" type="button">Visa regentlängden</button>
  </div>
  <section class="ledger" id="ledger" hidden>
    <h2>Sveriges regentlängd från 1523</h2>
    <ol id="ledgerList"></ol>
  </section>
  <p class="ver"><a href="../">&larr; Alla Peters appar</a> · Version 1.0 (prov) · 3 november 2026</p>
</div>

<script>
const R=[["Gustav Vasa",1523,1560],["Erik XIV",1560,1568],["Johan III",1568,1592],["Sigismund",1592,1599],["Karl IX",1599,1611],
["Gustav II Adolf",1611,1632],["Kristina",1632,1654],["Karl X Gustav",1654,1660],["Karl XI",1660,1697],["Karl XII",1697,1718],
["Ulrika Eleonora",1718,1720],["Fredrik I",1720,1751],["Adolf Fredrik",1751,1771],["Gustav III",1771,1792],["Gustav IV Adolf",1792,1809],
["Karl XIII",1809,1818],["Karl XIV Johan",1818,1844],["Oscar I",1844,1859],["Karl XV",1859,1872],["Oscar II",1872,1907],
["Gustaf V",1907,1950],["Gustaf VI Adolf",1950,1973],["Carl XVI Gustaf",1973,null]];
const E=[
[1527,"Riksdagen i Västerås bryter med påven – reformationen inleds",0],[1541,"Den första svenska helbibeln trycks",0],
[1543,"Nils Dacke besegras och Dackefejden tar slut",0],[1544,"Sverige blir ett arvrike",0],[1543,"Kopernikus ger ut sin bok om att jorden kretsar kring solen",0],
[1558,"Elizabeth I blir drottning av England",0],[1563,"Nordiska sjuårskriget mot Danmark bryter ut",1],[1567,"Sturemorden i Uppsala slott",1],
[1564,"William Shakespeare föds",1],[1570,"Freden i Stettin avslutar nordiska sjuårskriget",2],[1588,"Spanska armadan besegras av England",2],
[1582,"Den gregorianska kalendern införs i de katolska länderna",2],[1593,"Uppsala möte slår fast den lutherska läran",3],
[1598,"Slaget vid Stångebro",3],[1605,"Svenskarna lider nederlag mot polackerna vid Kirkholm",4],[1609,"Galileo riktar sitt teleskop mot himlen",4],
[1617,"Freden i Stolbova – Ryssland stängs ute från Östersjön",5],[1618,"Trettioåriga kriget bryter ut",5],[1620,"Mayflower seglar till Amerika",5],
[1621,"Göteborg grundas",5],[1628,"Regalskeppet Vasa sjunker på jungfruturen",5],[1630,"Svenska armén landstiger i Tyskland",5],
[1636,"Postverket grundas",6],[1638,"Kolonin Nya Sverige anläggs i Delaware",6],[1642,"Rembrandt målar Nattvakten",6],
[1645,"Freden i Brömsebro – Gotland blir svenskt",6],[1648,"Westfaliska freden avslutar trettioåriga kriget",6],
[1658,"Tåget över Bält och freden i Roskilde – Skåne blir svenskt",7],[1666,"Lunds universitet grundas",8],[1666,"Stora branden i London",8],
[1668,"Riksbanken grundas – världens äldsta centralbank",8],[1676,"Slaget vid Lund",8],[1680,"Enväldet och den stora reduktionen införs",8],
[1687,"Isaac Newton ger ut Principia",8],[1700,"Slaget vid Narva",9],[1709,"Slaget vid Poltava",9],[1713,"Kalabaliken i Bender",9],
[1719,"Rysshärjningarna längs den svenska ostkusten",10],[1721,"Freden i Nystad – stormaktstiden är över",11],
[1731,"Svenska Ostindiska Companiet grundas",11],[1735,"Linné ger ut Systema Naturae",11],[1739,"Kungliga Vetenskapsakademien grundas",11],
[1742,"Celsius presenterar sin temperaturskala",11],[1745,"Ostindiefararen Götheborg förliser utanför Nya Älvsborg",11],
[1756,"Wolfgang Amadeus Mozart föds",12],[1766,"Världens första tryckfrihetsförordning antas",12],
[1771,"Kungen dör efter en måltid som avslutas med hetvägg",12],[1772,"Statskuppen som avslutar frihetstiden",13],
[1776,"USA:s självständighetsförklaring",13],[1782,"Kungliga Operan invigs",13],[1786,"Svenska Akademien instiftas",13],
[1789,"Franska revolutionen bryter ut",13],[1790,"Sjöslaget vid Svensksund",13],[1792,"Maskeradbalen på Operan",13],
[1805,"Sverige går med i kriget mot Napoleon",14],[1808,"Finska kriget bryter ut",14],[1809,"Freden i Fredrikshamn – Finland går förlorat",15],
[1810,"Jean Baptiste Bernadotte väljs till tronföljare",15],[1814,"Sveriges senaste krig – unionen med Norge börjar",15],
[1815,"Slaget vid Waterloo",15],[1832,"Göta kanal invigs",16],[1842,"Folkskolestadgan – allmän skolplikt",16],
[1856,"Sveriges första järnväg för allmän trafik öppnar",17],[1866,"Ståndsriksdagen ersätts av tvåkammarriksdag",18],
[1867,"Alfred Nobel patenterar dynamiten",18],[1873,"Kronan och öret blir Sveriges valuta",19],[1876,"Bell patenterar telefonen",19],
[1901,"De första Nobelprisen delas ut",19],[1905,"Unionen med Norge upplöses",19],[1912,"Olympiska spelen i Stockholm",20],
[1914,"Bondetåget och första världskrigets utbrott",20],[1921,"Kvinnor röstar för första gången i riksdagsval",20],
[1945,"Andra världskriget tar slut",20],[1958,"Fotbolls-VM spelas i Sverige",21],[1967,"Dagen H – högertrafik införs",21],
[1969,"Månlandningen",21],[1974,"ABBA vinner Eurovision med Waterloo",22],[1986,"Statsminister Olof Palme mördas",22],
[1989,"Berlinmuren faller",22],[1995,"Sverige blir medlem i EU",22],[2000,"Öresundsbron invigs",22]];
const ROUND=10;
const $=id=>document.getElementById(id);
const yrs=i=>`${R[i][1]}–${R[i][2]??""}`;
let deck=[],pos=0,score=0,results=[],best=null;
try{best=JSON.parse(localStorage.getItem("vvk-best"))}catch(e){}
try{const s=localStorage.getItem("vvk-year");if(s!==null)$("showYear").checked=s==="1"}catch(e){}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function options(c){
  let pool=[];for(let d=-3;d<=3;d++){const k=c+d;if(d&&k>=0&&k<R.length)pool.push(k)}
  shuffle(pool);
  pool.sort((a,b)=>Math.abs(a-c)-Math.abs(b-c)+ (Math.random()-.5)*2.5);
  return shuffle([c,...pool.slice(0,3)]);
}
function newRound(){deck=shuffle(E.slice()).slice(0,ROUND);pos=0;score=0;results=[];render()}
function drawProgress(){
  $("progress").innerHTML=Array.from({length:ROUND},(_,i)=>`<i class="${results[i]===true?"ok":results[i]===false?"bad":i===pos?"now":""}"></i>`).join("");
  $("score").textContent=score;$("asked").textContent=results.length;$("best").textContent=best==null?"–":best+"/"+ROUND;
}
function render(){
  drawProgress();
  if(pos>=ROUND)return finish();
  const [y,txt,c]=deck[pos];const show=$("showYear").checked;
  $("stage").innerHTML=`<div class="card">
    <div class="year ${show?"":"hidden"}">${show?y:"Årtal dolt"}</div>
    <div class="event">${txt}</div>
    <div class="q">Vem regerade Sverige?</div>
    <div class="choices">${options(c).map(i=>`<button class="choice" type="button" data-i="${i}">${R[i][0]}${show?"":`<small>${yrs(i)}</small>`}</button>`).join("")}</div>
    <div id="fb"></div></div>`;
  $("stage").querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(+b.dataset.i,c,y));
  highlight(-1);
}
function answer(i,c,y){
  const ok=i===c;if(ok)score++;results.push(ok);
  $("stage").querySelectorAll(".choice").forEach(b=>{b.disabled=true;const k=+b.dataset.i;
    if(k===c)b.classList.add("ok");else if(k===i)b.classList.add("bad")});
  $("fb").innerHTML=`<div class="feedback">${ok?"Rätt!":"Tyvärr."} År ${y} regerade <b>${R[c][0]}</b> (${yrs(c)}).</div>
    <div class="row" style="margin-top:10px"><span></span><button class="btn" id="next" type="button">${pos+1<ROUND?"Nästa händelse":"Se resultat"}</button></div>`;
  highlight(c);drawProgress();
  $("next").onclick=()=>{pos++;render()};$("next").focus();
}
function finish(){
  if(best==null||score>best){best=score;try{localStorage.setItem("vvk-best",best)}catch(e){}}
  drawProgress();
  const msg=score===10?"Fullt hus – en riktig rikshistoriograf.":score>=7?"Stark omgång.":score>=4?"Godkänt. Regentlängden hjälper.":"Kungarna är många. Ny chans!";
  $("stage").innerHTML=`<div class="card final"><div class="q">Omgången klar</div><div class="big">${score}/${ROUND}</div><div>${msg}</div>
    <button class="btn" id="again" type="button" style="margin-top:8px">Ny omgång</button></div>`;
  $("again").onclick=newRound;
}
function buildLedger(){
  const max=Math.max(...R.map(r=>(r[2]??2026)-r[1]));
  $("ledgerList").innerHTML=R.map((r,i)=>`<li data-i="${i}"><span>${r[0]}</span><span class="yrs">${yrs(i)}</span><div class="bar"><span style="width:${((r[2]??2026)-r[1])/max*100}%"></span></div></li>`).join("");
}
function highlight(c){document.querySelectorAll("#ledgerList li").forEach(li=>li.classList.toggle("hl",+li.dataset.i===c))}
$("ledgerBtn").onclick=()=>{const l=$("ledger");l.hidden=!l.hidden;$("ledgerBtn").textContent=l.hidden?"Visa regentlängden":"Dölj regentlängden"};
$("showYear").onchange=e=>{try{localStorage.setItem("vvk-year",e.target.checked?"1":"0")}catch(x){} if(pos<ROUND&&results.length===pos)render()};
buildLedger();newRound();
</script>
<script>if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body></html>
