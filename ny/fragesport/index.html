/* Layout: ett kort i mitten — kategorilotteri överst, fråga, tre stora svarsknappar */
:root{
  --bg:#eef1f6; --card:#ffffff; --fg:#1f2433; --muted:#6b7187; --line:#d9deea;
  --accent:#3b5bdb; --ok:#2f9e44; --bad:#e03131;
  --sport:#2f9e44; --historia:#b5651d; --musik:#c2255c; --underhallning:#7048e8; --blandat:#1c7ed6;
  --display:"Lilita One","Arial Rounded MT Bold",sans-serif;
  --body:"Rubik",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151925; --card:#1f2535; --fg:#eef1f8; --muted:#9aa1b8; --line:#30384d;
  --accent:#748ffc; --ok:#51cf66; --bad:#ff6b6b;
  --sport:#51cf66; --historia:#e0954f; --musik:#f06595; --underhallning:#9775fa; --blandat:#4dabf7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151925; --card:#1f2535; --fg:#eef1f8; --muted:#9aa1b8; --line:#30384d;
  --accent:#748ffc; --ok:#51cf66; --bad:#ff6b6b;
  --sport:#51cf66; --historia:#e0954f; --musik:#f06595; --underhallning:#9775fa; --blandat:#4dabf7; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;margin:0;line-height:1}
.stat{text-align:right;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--display);font-weight:400;font-size:1.6rem;display:block;line-height:1}
.stat small{color:var(--muted);font-size:.8rem}
.progress{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.progress i{height:8px;border-radius:3px;background:var(--line)}
.progress i.ok{background:var(--ok)} .progress i.bad{background:var(--bad)} .progress i.now{background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.cat{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;
  font-weight:600;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--c,var(--accent))}
.cat.spin{animation:pulse .12s linear infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.qnum{color:var(--muted);font-size:.85rem}
.q{font-size:1.3rem;font-weight:600;margin:0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opts button{font:inherit;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);
  background:var(--bg);color:var(--fg);cursor:pointer;display:flex;gap:12px;align-items:center}
.opts button span.l{font-family:var(--display);font-size:1.1rem;color:var(--muted);width:1.2em}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button:disabled{cursor:default}
.opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.feedback{font-weight:600;min-height:1.4em;margin:0}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
.primary{font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px;cursor:pointer;width:100%}
.lvl{color:var(--muted);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;margin-top:4px;min-height:1.2em}
.ghost{font:inherit;font-weight:600;background:none;color:var(--accent);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;width:100%}
.big{font-family:var(--display);font-size:4rem;line-height:1;text-align:center;margin:0}
.center{text-align:center;color:var(--muted);margin:0}
.breakdown{display:flex;flex-direction:column;gap:8px}
.br{display:grid;grid-template-columns:8.5em 1fr 3em;align-items:center;gap:10px;font-size:.95rem}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.br .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.cat.spin{animation:none}}
</style>

const N=20;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const card=document.getElementById('card');
let pool,i,score,results,catStats,level,Q;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function menu(){
  document.getElementById('progress').innerHTML='';

  document.getElementById('lvl').textContent='';
  card.innerHTML=`<p class="q">Välj svårighetsgrad</p><p class="center" style="text-align:left">20 frågor, tre svarsalternativ. Kategorin lottas inför varje fråga.</p>
    <div class="opts">${Object.keys(LEVELS).map((k,n)=>`<button data-l="${k}"><span class="l">${n+1}</span><span>${LEVELS[k]}</span></button>`).join('')}</div>`;
  card.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{level=b.dataset.l;Q=BANK[level];start()});
}
function start(){
  document.getElementById('lvl').textContent=LEVELS[level];
  pool={};for(const k in Q)pool[k]=shuffle(Q[k]);
  i=0;score=0;results=[];catStats={};for(const k in Q)catStats[k]=[0,0];
  document.getElementById('score').textContent=0;
  next();
}
function drawProgress(){
  const p=document.getElementById('progress');p.innerHTML='';
  for(let k=0;k<N;k++){const e=document.createElement('i');
    if(k<results.length)e.className=results[k]?'ok':'bad';else if(k===i)e.className='now';p.appendChild(e)}
}
function pickCat(){const keys=Object.keys(pool).filter(k=>pool[k].length);return keys[Math.floor(Math.random()*keys.length)]}
function next(){
  if(i>=N)return end();
  drawProgress();
  const cat=pickCat(), q=pool[cat].pop();
  card.innerHTML=`<span class="cat spin" id="cat">Lottar kategori…</span><div class="qnum">Fråga ${i+1} av ${N}</div>`;
  const pill=document.getElementById('cat');const keys=Object.keys(CATS);let t=0;
  const spin=setInterval(()=>{const k=keys[t++%keys.length];pill.textContent=CATS[k].name;pill.style.setProperty('--c',CATS[k].c)},110);
  setTimeout(()=>{clearInterval(spin);show(cat,q)},reduce?0:1100);
}
function show(cat,q){
  const opts=shuffle(q.slice(1));
  card.innerHTML=`<span class="cat" style="--c:${CATS[cat].c}">${CATS[cat].name}</span>
    <div class="qnum">Fråga ${i+1} av ${N}</div>
    <p class="q"></p>
    <div class="opts">${opts.map((o,k)=>`<button data-k="${k}"><span class="l">${'ABC'[k]}</span><span class="t"></span></button>`).join('')}</div>
    <p class="feedback" id="fb" aria-live="polite"></p>
    <button class="primary" id="nx" hidden>${i+1<N?'Nästa fråga':'Se resultatet'}</button>`;
  card.querySelector('.q').textContent=q[0];
  const btns=[...card.querySelectorAll('.opts button')];
  btns.forEach((b,k)=>b.querySelector('.t').textContent=opts[k]);
  btns.forEach((b,k)=>b.onclick=()=>{
    const ok=opts[k]===q[1];
    btns.forEach((x,j)=>{x.disabled=true;if(opts[j]===q[1])x.classList.add('right')});
    if(!ok)b.classList.add('wrong');
    const fb=document.getElementById('fb');
    fb.className='feedback '+(ok?'ok':'bad');fb.textContent=ok?'Rätt!':'Fel – rätt svar är '+q[1]+'.';
    if(ok){score++;document.getElementById('score').textContent=score}
    results.push(ok);catStats[cat][1]++;if(ok)catStats[cat][0]++;
    i++;drawProgress();
    const nx=document.getElementById('nx');nx.hidden=false;nx.focus();nx.onclick=next;
  });
}
function end(){
  drawProgress();
  const verdict=score>=17?'Mästarklass!':score>=13?'Riktigt bra jobbat.':score>=9?'Godkänt, men det finns mer att hämta.':'Bättre lycka nästa runda!';
  card.innerHTML=`<p class="center">Ni fick</p><p class="big">${score} / ${N}</p><p class="center">${verdict}</p>
    <div class="breakdown">${Object.keys(CATS).filter(k=>catStats[k][1]).map(k=>{const [r,t]=catStats[k];
      return `<div class="br"><span>${CATS[k].name}</span><span class="bar" style="--c:${CATS[k].c}"><i style="width:${r/t*100}%"></i></span><span class="n">${r}/${t}</span></div>`}).join('')}</div>
    <button class="primary" id="again">Spela igen på ${LEVELS[level].toLowerCase()}</button>
    <button class="ghost" id="other">Byt svårighetsgrad</button>`;
  document.getElementById('again').onclick=start;document.getElementById('other').onclick=menu;
}
menu();
</script>

<script>if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
