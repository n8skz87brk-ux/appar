<!doctype html>
<html lang="sv"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Frågesport om Vadstena: 20 frågor, tre svarsalternativ.">
<meta name="theme-color" content="#3b5bdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vadstena">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
.ver{color:var(--muted);font-size:.82rem;margin:0;text-align:center}.ver a{color:inherit}</style>
<title>Vadstenafrågan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script data-goatcounter="https://ekvardt.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: ett kort i mitten — kategorilotteri överst, fråga, tre stora svarsknappar */
:root{
  --bg:#eef1f6; --card:#ffffff; --fg:#1f2433; --muted:#6b7187; --line:#d9deea;
  --accent:#3b5bdb; --ok:#2f9e44; --bad:#e03131;
  --sport:#2f9e44; --historia:#b5651d; --musik:#c2255c; --underhallning:#7048e8; --blandat:#1c7ed6;
  --display:"Lilita One","Arial Rounded MT Bold",sans-serif;
  --body:"Rubik",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151925; --card:#1f2535; --fg:#eef1f8; --muted:#9aa1b8; --line:#30384d;
  --accent:#748ffc; --ok:#51cf66; --bad:#ff6b6b;
  --sport:#51cf66; --historia:#e0954f; --musik:#f06595; --underhallning:#9775fa; --blandat:#4dabf7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151925; --card:#1f2535; --fg:#eef1f8; --muted:#9aa1b8; --line:#30384d;
  --accent:#748ffc; --ok:#51cf66; --bad:#ff6b6b;
  --sport:#51cf66; --historia:#e0954f; --musik:#f06595; --underhallning:#9775fa; --blandat:#4dabf7; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;margin:0;line-height:1}
.stat{text-align:right;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--display);font-weight:400;font-size:1.6rem;display:block;line-height:1}
.stat small{color:var(--muted);font-size:.8rem}
.progress{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.progress i{height:8px;border-radius:3px;background:var(--line)}
.progress i.ok{background:var(--ok)} .progress i.bad{background:var(--bad)} .progress i.now{background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.cat{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;
  font-weight:600;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--c,var(--accent))}
.cat.spin{animation:pulse .12s linear infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.qnum{color:var(--muted);font-size:.85rem}
.q{font-size:1.3rem;font-weight:600;margin:0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opts button{font:inherit;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);
  background:var(--bg);color:var(--fg);cursor:pointer;display:flex;gap:12px;align-items:center}
.opts button span.l{font-family:var(--display);font-size:1.1rem;color:var(--muted);width:1.2em}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button:disabled{cursor:default}
.opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.feedback{font-weight:600;min-height:1.4em;margin:0}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
.primary{font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px;cursor:pointer;width:100%}
.lvl{color:var(--muted);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;margin-top:4px;min-height:1.2em}
.ghost{font:inherit;font-weight:600;background:none;color:var(--accent);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;width:100%}
.big{font-family:var(--display);font-size:4rem;line-height:1;text-align:center;margin:0}
.center{text-align:center;color:var(--muted);margin:0}
.breakdown{display:flex;flex-direction:column;gap:8px}
.br{display:grid;grid-template-columns:8.5em 1fr 3em;align-items:center;gap:10px;font-size:.95rem}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.br .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.cat.spin{animation:none}}
</style>

<div class="wrap">
  <header>
    <div><h1>Vadstenafrågan</h1><div class="lvl" id="lvl"></div></div>
    <div class="stat"><b id="score">0</b><small>rätt</small></div>
  </header>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <main class="card" id="card"></main>
  <p class="ver"><a href="../">&larr; Alla Peters appar</a> · Version 1.0 (prov) · 26 november 2026</p>
</div>

<script>
const CATS={
  klostret:{name:'Birgitta & klostret',c:'var(--underhallning)'},
  slottet:{name:'Slottet',c:'var(--historia)'},
  staden:{name:'Staden',c:'var(--blandat)'},
  kultur:{name:'Kultur & kändisar',c:'var(--musik)'},
  omgivning:{name:'Runt Vadstena',c:'var(--sport)'}
};
// Första svaret är alltid det rätta; ordningen blandas i spelet.
const LEVELS={vadstena:'Vadstena'};
const BANK={
vadstena:{
 klostret:[
  ["I vilket år föddes heliga Birgitta?", "1303", "1347", "1253"],
  ["Vilken kung skänkte gården i Vadstena till Birgittas kloster?", "Magnus Eriksson", "Magnus Ladulås", "Albrekt av Mecklenburg"],
  ["Vad hette Birgittas man?", "Ulf Gudmarsson", "Birger Persson", "Bo Jonsson Grip"],
  ["I vilken stad dog Birgitta år 1373?", "Rom", "Avignon", "Jerusalem"],
  ["Vilken av Birgittas döttrar förde hem hennes kvarlevor till Vadstena?", "Katarina", "Märta", "Cecilia"],
  ["Vad heter munk- och nunneorden som Birgitta grundade?", "Birgittinorden", "Cistercienserorden", "Dominikanorden"],
  ["Vilket år helgonförklarades Birgitta?", "1391", "1430", "1350"],
  ["Vilket år invigdes Vadstena klosterkyrka?", "1430", "1384", "1527"],
  ["Vad kallas klosterkyrkan i folkmun?", "Blå kyrkan", "Röda kyrkan", "Vita kyrkan"],
  ["Av vilket material är klosterkyrkan byggd?", "Kalksten", "Tegel", "Granit"],
  ["Vem beskrev hur klosterkyrkan skulle byggas, enligt uppenbarelser hon fått?", "Heliga Birgitta", "Drottning Margareta", "Katarina av Vadstena"],
  ["Nunneklostret inrättades i ett gammalt kungligt palats. Vilken ätt hade byggt det?", "Bjälboätten (Folkungaätten)", "Vasaätten", "Sverkerska ätten"],
  ["Vad blev klostret under medeltiden?", "Sveriges största jordägare", "Sveriges första universitet", "Sveriges största fästning"],
  ["Vilket år stängdes klostret efter reformationen?", "1595", "1527", "1523"],
  ["Vem lät stänga klostret?", "Hertig Karl (sedan Karl IX)", "Gustav Vasa", "Johan III"],
  ["Vart reste de sista nunnorna när klostret stängdes?", "Danzig (Gdańsk)", "Rom", "Lübeck"],
  ["Ungefär när kom birgittasystrar tillbaka till Vadstena?", "På 1960-talet", "På 1890-talet", "På 2000-talet"]
 ],
 slottet:[
  ["Vilken kung började bygga Vadstena slott?", "Gustav Vasa", "Johan III", "Karl IX"],
  ["Vilket år började slottet byggas?", "1545", "1523", "1620"],
  ["Varför byggdes slottet från början?", "Som försvarsborg", "Som kloster", "Som jaktslott"],
  ["Gustav Vasa gifte sig i Vadstena 1552. Med vem?", "Katarina Stenbock", "Margareta Leijonhufvud", "Katarina av Sachsen-Lauenburg"],
  ["Vad heter slottets stora sal, uppkallad efter kungens bröllop?", "Bröllopssalen", "Rikssalen", "Riddarsalen"],
  ["Vilken av Gustav Vasas söner fick slottet som residens?", "Hertig Magnus", "Erik", "Johan"],
  ["Enligt sägnen hoppade hertig Magnus ut genom ett fönster mot vallgraven. Vad trodde han att han såg?", "En sjöjungfru", "En drake", "Ett spöke"],
  ["Var ligger hertig Magnus begravd?", "I Vadstena klosterkyrka", "I Uppsala domkyrka", "I Riddarholmskyrkan"],
  ["När stod slottet färdigt?", "På 1600-talet", "På 1500-talet", "På 1700-talet"],
  ["Vad finns i slottet i dag, förutom sommaropera?", "Riksarkivets landsarkiv", "Ett fängelse", "Ett vandrarhem"],
  ["Vad omger slottet?", "En vallgrav", "En ringmur med åtta torn", "En lövskog"]
 ],
 staden:[
  ["Vid vilken sjö ligger Vadstena?", "Vättern", "Vänern", "Mälaren"],
  ["På vilken sida av sjön ligger Vadstena?", "Östra", "Västra", "Norra"],
  ["I vilket landskap ligger Vadstena?", "Östergötland", "Västergötland", "Småland"],
  ["Vilket år fick Vadstena stadsprivilegier?", "1400", "1350", "1545"],
  ["Vem gav Vadstena stadsprivilegierna?", "Drottning Margareta", "Gustav Vasa", "Magnus Eriksson"],
  ["Vadstena har Sveriges äldsta bevarade …?", "Rådhus", "Apotek", "Järnvägsstation"],
  ["Vad föreställer Vadstenas kommunvapen?", "Birgitta som skriver i en bok", "Ett slott vid vatten", "Tre kronor"],
  ["Vilken kommun ingick Vadstena i mellan 1974 och 1980?", "Motala", "Mjölby", "Linköping"],
  ["Vad grundade borgaren Mårten Skinnare 1519?", "Ett hospital", "En skola", "Ett bryggeri"],
  ["Vad inrättades 1826 i Vadstena, som det första i sitt slag i Sverige?", "Ett centralhospital för psykiskt sjuka", "Ett sjömansinstitut", "Ett barnhem"],
  ["Vad användes de gamla klosterbyggnaderna till under 1600- och 1700-talen?", "Krigsmanshus för gamla och sårade soldater", "Kungligt stuteri", "Kronans tullhus"],
  ["Vilket riktnummer har Vadstena?", "0143", "0141", "0142"]
 ],
 kultur:[
  ["Vad sysslar Vadstena-Akademien med?", "Opera", "Konst", "Litteratur"],
  ["Vilket år grundades Vadstena-Akademien?", "1964", "1932", "1989"],
  ["Vilken scen i stan används av Vadstena-Akademien?", "Gamla teatern", "Rödtornet", "Rådhuset"],
  ["Vilket hantverk är Vadstena känt för?", "Knyppling av spetsar", "Glasblåsning", "Smide"],
  ["Vilken sport spelar Vadstenabördiga Stina Blackstenius?", "Fotboll", "Handboll", "Ishockey"],
  ["Naturforskaren Erik Acharius var läkare i Vadstena. Vad forskade han om?", "Lavar", "Fåglar", "Fjärilar"]
 ],
 omgivning:[
  ["Vilket berg ligger ett par mil söder om Vadstena vid Vätterns strand?", "Omberg", "Kinnekulle", "Billingen"],
  ["Vilken fågelsjö ligger strax sydost om Vadstena?", "Tåkern", "Hornborgasjön", "Kvismaren"],
  ["Vilken berömd runsten står i Rök, några mil söder om Vadstena?", "Rökstenen", "Jellingestenen", "Sparlösastenen"],
  ["Vad hette gården nordost om Vadstena där Birgitta bodde med sin familj?", "Ulvåsa", "Finsta", "Alvastra"],
  ["Vilket kloster, vars ruiner ligger vid Omberg, är äldre än Vadstena kloster?", "Alvastra kloster", "Vreta kloster", "Varnhems kloster"]
 ]
}
};
const N=20;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const card=document.getElementById('card');
let pool,i,score,results,catStats,level,Q;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function menu(){
  document.getElementById('progress').innerHTML='';
  document.getElementById('score').textContent=0;
  document.getElementById('lvl').textContent='';
  level='vadstena';Q=BANK[level];
  card.innerHTML=`<p class="q">Hur väl känner ni Vadstena?</p><p class="center" style="text-align:left">20 frågor om klostret, slottet, staden och trakten runt omkring. Tre svar att välja på, och kategorin lottas inför varje fråga. Spelet minns vilka frågor ni redan fått.</p>
    <button class="primary" id="go">Starta</button>`;
  document.getElementById('go').onclick=start;
}
function start(){
  document.getElementById('lvl').textContent=Object.values(Q).flat().length+' frågor';
  // Osedda frågor först (pop tar från slutet); när hela nivån är spelad börjar den om.
  let seen=getSeen();
  if(Object.values(Q).flat().every(q=>seen.has(q[0]))){seen=new Set();saveSeen(seen)}
  pool={};for(const k in Q){const u=Q[k].filter(q=>!seen.has(q[0])),s=Q[k].filter(q=>seen.has(q[0]));pool[k]=[...shuffle(s),...shuffle(u)]}
  i=0;score=0;results=[];catStats={};for(const k in Q)catStats[k]=[0,0];
  document.getElementById('score').textContent=0;
  next();
}
function drawProgress(){
  const p=document.getElementById('progress');p.innerHTML='';
  for(let k=0;k<N;k++){const e=document.createElement('i');
    if(k<results.length)e.className=results[k]?'ok':'bad';else if(k===i)e.className='now';p.appendChild(e)}
}
function getSeen(){try{return new Set(JSON.parse(localStorage.getItem('vfs-seen-'+level)||'[]'))}catch(e){return new Set()}}
function saveSeen(s){try{localStorage.setItem('vfs-seen-'+level,JSON.stringify([...s]))}catch(e){}}
function markSeen(t){const s=getSeen();s.add(t);saveSeen(s)}
function pickCat(){const all=Object.keys(pool).filter(k=>pool[k].length);const seen=getSeen();
  const fresh=all.filter(k=>!seen.has(pool[k][pool[k].length-1][0]));const keys=fresh.length?fresh:all;return keys[Math.floor(Math.random()*keys.length)]}
function next(){
  if(i>=N)return end();
  drawProgress();
  const cat=pickCat(), q=pool[cat].pop();
  card.innerHTML=`<span class="cat spin" id="cat">Lottar kategori…</span><div class="qnum">Fråga ${i+1} av ${N}</div>`;
  const pill=document.getElementById('cat');const keys=Object.keys(CATS);let t=0;
  const spin=setInterval(()=>{const k=keys[t++%keys.length];pill.textContent=CATS[k].name;pill.style.setProperty('--c',CATS[k].c)},110);
  setTimeout(()=>{clearInterval(spin);show(cat,q)},reduce?0:1100);
}
function show(cat,q){
  const opts=shuffle(q.slice(1));
  card.innerHTML=`<span class="cat" style="--c:${CATS[cat].c}">${CATS[cat].name}</span>
    <div class="qnum">Fråga ${i+1} av ${N}</div>
    <p class="q"></p>
    <div class="opts">${opts.map((o,k)=>`<button data-k="${k}"><span class="l">${'ABC'[k]}</span><span class="t"></span></button>`).join('')}</div>
    <p class="feedback" id="fb" aria-live="polite"></p>
    <button class="primary" id="nx" hidden>${i+1<N?'Nästa fråga':'Se resultatet'}</button>`;
  card.querySelector('.q').textContent=q[0];markSeen(q[0]);
  const btns=[...card.querySelectorAll('.opts button')];
  btns.forEach((b,k)=>b.querySelector('.t').textContent=opts[k]);
  btns.forEach((b,k)=>b.onclick=()=>{
    const ok=opts[k]===q[1];
    btns.forEach((x,j)=>{x.disabled=true;if(opts[j]===q[1])x.classList.add('right')});
    if(!ok)b.classList.add('wrong');
    const fb=document.getElementById('fb');
    fb.className='feedback '+(ok?'ok':'bad');fb.textContent=ok?'Rätt!':'Fel – rätt svar är '+q[1]+'.';
    if(ok){score++;document.getElementById('score').textContent=score}
    results.push(ok);catStats[cat][1]++;if(ok)catStats[cat][0]++;
    i++;drawProgress();
    const nx=document.getElementById('nx');nx.hidden=false;nx.focus();nx.onclick=next;
  });
}
function end(){
  drawProgress();
  const verdict=score>=17?'Mästarklass!':score>=13?'Riktigt bra jobbat.':score>=9?'Godkänt, men det finns mer att hämta.':'Bättre lycka nästa runda!';
  card.innerHTML=`<p class="center">Ni fick</p><p class="big">${score} / ${N}</p><p class="center">${verdict}</p>
    <div class="breakdown">${Object.keys(CATS).filter(k=>catStats[k][1]).map(k=>{const [r,t]=catStats[k];
      return `<div class="br"><span>${CATS[k].name}</span><span class="bar" style="--c:${CATS[k].c}"><i style="width:${r/t*100}%"></i></span><span class="n">${r}/${t}</span></div>`}).join('')}</div>
    <button class="primary" id="again">Spela igen</button>
`;
  document.getElementById('again').onclick=start;
}
menu();
</script>

<script>if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body></html>
