<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}

<title>Vad är flest?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script data-goatcounter="https://ekvardt.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head><body>
<style>
/* Layout: one column; two big answer cards facing each other across an "eller", tally strip on top */
:root{
  --bg:#eef3f1; --surface:#ffffff; --ink:#132a26; --muted:#5a6f6a; --line:#d3dfdb;
  --accent:#0f7b6c; --accent-ink:#ffffff; --num:#c97a10;
  --ok:#1e7a46; --ok-bg:#dcf1e4; --bad:#b03a3a; --bad-bg:#f7e1e1;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1715; --surface:#14241f; --ink:#e4efec; --muted:#93aaa4; --line:#26403a;
  --accent:#3cc4ae; --accent-ink:#06201b; --num:#f2b44a;
  --ok:#6fd69c; --ok-bg:#143627; --bad:#f08f8f; --bad-bg:#3b1c1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1715; --surface:#14241f; --ink:#e4efec; --muted:#93aaa4; --line:#26403a;
  --accent:#3cc4ae; --accent-ink:#06201b; --num:#f2b44a;
  --ok:#6fd69c; --ok-bg:#143627; --bad:#f08f8f; --bad-bg:#3b1c1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.05;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.stats{display:flex;gap:14px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.level{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--surface)}
.level button{font:inherit;font-size:.85rem;font-weight:700;border:0;border-radius:999px;padding:6px 14px;background:transparent;color:var(--muted);cursor:pointer}
.level button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.ok{background:var(--ok)} .progress i.bad{background:var(--bad)} .progress i.now{background:var(--num)}
.q{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
@media (max-width:420px){.duel{grid-template-columns:1fr}.or{padding:0!important}}
.or{align-self:center;font-family:var(--display);font-weight:600;color:var(--muted);padding:0 2px;text-align:center}
.pick{font:inherit;text-align:center;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:16px;
  padding:22px 14px;min-height:150px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;cursor:pointer;min-width:0}
.pick:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.pick:focus-visible,.btn:focus-visible,.level button:focus-visible{outline:3px solid var(--num);outline-offset:2px}
.pick .what{font-size:1.12rem;font-weight:700;text-wrap:balance}
.pick .val{font-family:var(--display);font-weight:800;font-size:1.7rem;color:var(--num);font-variant-numeric:tabular-nums;line-height:1;min-height:1.7rem}
.pick .val small{font-family:var(--body);font-size:.8rem;font-weight:400;color:var(--muted);margin-right:3px}
.pick .note{font-size:.8rem;color:var(--muted)}
.pick.ok{border-color:var(--ok);background:var(--ok-bg)}
.pick.bad{border-color:var(--bad);background:var(--bad-bg)}
.pick:disabled{cursor:default}
.feedback{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.feedback p{margin:0;min-width:0;flex:1 1 220px}
.btn{font:inherit;font-weight:700;padding:12px 18px;border-radius:10px;border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.final{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.final .big{font-family:var(--display);font-weight:800;font-size:3.4rem;color:var(--num);line-height:1}
.hint{font-size:.85rem;color:var(--muted);text-align:center;margin:0}
@media (prefers-reduced-motion:no-preference){.pick{transition:transform .12s,border-color .12s,background .2s}.val.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}}
</style>

<div class="wrap">
  <header>
    <h1>Vad är <span>flest?</span></h1>
    <div class="stats"><span>Rätt <b id="score">0</b>/<b id="asked">0</b></span><span>Rekord <b id="best">–</b></span></div>
  </header>
  <div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <div class="level" role="group" aria-label="Svårighet">
      <button type="button" id="lvl-latt" aria-pressed="true">Lagom</button>
      <button type="button" id="lvl-svar" aria-pressed="false">Klurigt</button>
    </div>
    <span class="hint" id="lvlhint">Talen skiljer sig tydligt åt</span>
  </div>
  <div class="progress" id="progress"></div>
  <div id="stage"></div>
  <p class="ver"><a href="../">&larr; Alla Peters appar</a> · Version 1.0 · 4 november 2026</p>
</div>

<script>
// [text, värde, ungefärligt?, osäkerhet (andel), notering]
const ITEMS=[
["Dagar i ett sekel",36525,0,0.001,"100 år med 24 eller 25 skottdagar"],
["Invånare i Norrköpings kommun",145000,1,0.03],
["Timmar på ett år",8760,0,0],
["Sekunder på ett dygn",86400,0,0],
["Minuter på en vecka",10080,0,0],
["Sekunder på en timme",3600,0,0],
["Dagar på ett år",365,0,0],
["Invånare i Visby",24000,1,0.05],
["Invånare på Gotland",61000,1,0.03],
["Gotlands yta i km²",3000,1,0.06],
["Vänerns yta i km²",5650,1,0.01],
["Kebnekaises höjd i meter",2097,1,0.01],
["Mount Everests höjd i meter",8849,0,0.001],
["Ben i en vuxen människas kropp",206,0,0],
["Tänder hos en vuxen",32,0,0],
["Tangenter på ett piano",88,0,0],
["Rutor på ett schackbräde",64,0,0],
["Kort i en kortlek utan jokrar",52,0,0],
["Fält på ett Monopolbräde",40,0,0],
["Hål på en vanlig golfbana",18,0,0],
["Kommuner i Sverige",290,0,0],
["Landskap i Sverige",25,0,0],
["Ledamöter i riksdagen",349,0,0],
["Ledamöter i Europaparlamentet",720,0,0],
["Ledamöter i Svenska Akademien",18,0,0],
["Regenter i Sverige sedan Gustav Vasa",23,0,0,"Gustav Vasa till Carl XVI Gustaf"],
["Länder i FN",193,0,0],
["Länder i EU",27,0,0],
["Bokstäver i svenska alfabetet",29,0,0],
["Öresundsbrons längd i meter",7845,0,0],
["Ölandsbrons längd i meter",6072,0,0],
["Turning Torsos höjd i meter",190,0,0],
["Kaknästornets höjd i meter",155,1,0.02],
["Eiffeltornets höjd i meter",330,1,0.01],
["Göta kanals längd i km",190,0,0.01,"inklusive sjöarna längs vägen"],
["Vasaloppets längd i km",90,0,0],
["Sveriges längd från norr till söder i km",1570,1,0.03],
["Meter i en engelsk mil",1609,0,0],
["Meter i en svensk mil",10000,0,0],
["Centiliter i en vinflaska",75,0,0],
["Tunnelbanestationer i Stockholm",100,0,0],
["Platser på Strawberry Arena vid fotboll",50000,1,0.06],
["Kilometer från jorden till månen",384400,1,0.02,"medelavstånd"],
["Jordens omkrets vid ekvatorn i km",40075,0,0],
["Ljudets hastighet i meter per sekund",343,1,0.02,"i luft vid 20 grader"],
["Ljusets hastighet i km per sekund",300000,1,0.001],
["Invånare i Stockholms kommun",990000,1,0.03],
["Invånare i Göteborgs kommun",600000,1,0.03],
["Invånare i Malmö kommun",360000,1,0.03],
["Invånare i Kiruna kommun",22000,1,0.05],
["Invånare på Island",390000,1,0.04],
["Invånare i Norge",5600000,1,0.02],
["Invånare i Sverige",10600000,1,0.02],
["Personbilar i trafik i Sverige",5000000,1,0.05],
["Öar i Sverige",267570,0,0.01,"enligt SCB:s räkning"],
["Öar på Åland",6500,1,0.1],
["Sjöar i Sverige större än en hektar",100000,1,0.1],
["Ord i SAOL, 14:e upplagan",126000,1,0.03],
["Hårstrån på ett människohuvud",100000,1,0.35,"varierar mycket mellan personer"],
["Hjärtslag på en timme i vila",4200,1,0.25,"vid ungefär 70 slag i minuten"],
];
// Tal som räknas fram för dagens datum
const now=Date.now(), DAY=864e5;
const since=(y,m,d)=>Math.floor((now-new Date(y,m-1,d).getTime())/DAY);
ITEMS.push(
["Dagar sedan regalskeppet Vasa sjönk",since(1628,8,10),0,0,"10 augusti 1628"],
["Dagar sedan Dagen H",since(1967,9,3),0,0,"3 september 1967"],
["Dagar sedan månlandningen",since(1969,7,20),0,0,"20 juli 1969"],
["Veckor sedan Gustav Vasa valdes till kung",Math.floor(since(1523,6,6)/7),0,0,"6 juni 1523"],
["Timmar sedan år 2000 började",Math.floor((now-new Date(2000,0,1).getTime())/36e5),0,0],
["Dagar sedan ABBA vann med Waterloo",since(1974,4,6),0,0,"6 april 1974"]
);

const ROUND=10;
const LEVELS={latt:{min:1.25,max:15,hint:"Talen skiljer sig tydligt åt"},svar:{min:1.08,max:1.7,hint:"Talen ligger nära varandra"}};
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString("sv-SE");
let level="latt",pairs=[],pos=0,score=0,results=[],best={};
try{best=JSON.parse(localStorage.getItem("flest-best"))||{}}catch(e){}
try{const l=localStorage.getItem("flest-level");if(l&&LEVELS[l])level=l}catch(e){}

function okPair(a,b){
  const A=ITEMS[a],B=ITEMS[b];if(A[1]===B[1])return false;
  const r=Math.max(A[1],B[1])/Math.min(A[1],B[1]);
  const need=Math.max(LEVELS[level].min,(1+A[3])*(1+B[3])*1.05);
  return r>=need&&r<=LEVELS[level].max;
}
function makePairs(){
  const out=[],used=new Set();let tries=0;
  while(out.length<ROUND&&tries<20000){tries++;
    const a=Math.floor(Math.random()*ITEMS.length),b=Math.floor(Math.random()*ITEMS.length);
    if(a===b||used.has(a)||used.has(b)||!okPair(a,b))continue;
    used.add(a);used.add(b);out.push([a,b]);
  }
  return out;
}
function newRound(){pairs=makePairs();pos=0;score=0;results=[];render()}
function drawTop(){
  $("progress").innerHTML=Array.from({length:ROUND},(_,i)=>`<i class="${results[i]===true?"ok":results[i]===false?"bad":i===pos?"now":""}"></i>`).join("");
  $("score").textContent=score;$("asked").textContent=results.length;
  $("best").textContent=best[level]==null?"–":best[level]+"/"+ROUND;
  $("lvl-latt").setAttribute("aria-pressed",level==="latt");$("lvl-svar").setAttribute("aria-pressed",level==="svar");
  $("lvlhint").textContent=LEVELS[level].hint;
}
function card(i){const it=ITEMS[i];return `<button class="pick" type="button" data-i="${i}"><span class="what">${it[0]}</span><span class="val"></span></button>`}
function render(){
  drawTop();
  if(pos>=pairs.length)return finish();
  const [a,b]=pairs[pos];
  $("stage").innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">
    <div class="q">Tryck på det som är flest</div>
    <div class="duel">${card(a)}<div class="or">eller</div>${card(b)}</div>
    <div id="fb"></div></div>`;
  $("stage").querySelectorAll(".pick").forEach(btn=>btn.onclick=()=>answer(+btn.dataset.i,a,b));
}
function answer(pick,a,b){
  const big=ITEMS[a][1]>ITEMS[b][1]?a:b, small=big===a?b:a, ok=pick===big;
  if(ok)score++;results.push(ok);
  $("stage").querySelectorAll(".pick").forEach(btn=>{
    const i=+btn.dataset.i,it=ITEMS[i];btn.disabled=true;
    if(i===big)btn.classList.add("ok");else if(i===pick)btn.classList.add("bad");
    const v=btn.querySelector(".val");v.innerHTML=(it[2]?"<small>ca</small>":"")+fmt(it[1]);v.classList.add("pop");
    if(it[4])btn.insertAdjacentHTML("beforeend",`<span class="note">${it[4]}</span>`);
  });
  const r=ITEMS[big][1]/ITEMS[small][1];
  const rel=r<1.95?`${Math.round((r-1)*100)} procent fler`:`ungefär ${r<10?r.toLocaleString("sv-SE",{maximumFractionDigits:1}):fmt(Math.round(r))} gånger så många`;
  $("fb").innerHTML=`<div class="feedback"><p><b>${ok?"Rätt!":"Tyvärr."}</b> ${ITEMS[big][0]} är ${rel}.</p>
    <button class="btn" id="next" type="button">${pos+1<pairs.length?"Nästa par":"Se resultat"}</button></div>`;
  drawTop();
  $("next").onclick=()=>{pos++;render()};$("next").focus();
}
function finish(){
  if(best[level]==null||score>best[level]){best[level]=score;try{localStorage.setItem("flest-best",JSON.stringify(best))}catch(e){}}
  drawTop();
  const msg=score===10?"Alla rätt. Imponerande känsla för tal.":score>=7?"Stark omgång.":score>=4?"Helt okej. Talen lurar ofta.":"Svårare än det ser ut. Ny chans!";
  $("stage").innerHTML=`<div class="final"><div class="q">Omgången klar</div><div class="big">${score}/${ROUND}</div><div>${msg}</div>
    <button class="btn" id="again" type="button" style="margin-top:8px">Ny omgång</button></div>`;
  $("again").onclick=newRound;
}
function setLevel(l){level=l;try{localStorage.setItem("flest-level",l)}catch(e){}newRound()}
$("lvl-latt").onclick=()=>setLevel("latt");$("lvl-svar").onclick=()=>setLevel("svar");
newRound();
</script>
<script>if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body></html>
