<style>
/* Layout: one column, sticky tab bar, round cards with court rows; table view for standings */
:root{
  --bg:#eef3f7; --surface:#ffffff; --fg:#14263a; --muted:#5d6f82; --line:#d5dfe8;
  --court:#1f5fa8; --ball:#c9e021; --ok:#2f8a4a; --warn:#b26a00;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1722; --surface:#15222f; --fg:#e4ecf3; --muted:#93a5b7; --line:#273848;
  --court:#5b9be0; --ball:#d4ea3a; --ok:#5cc07a; --warn:#e6a23c; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1722; --surface:#15222f; --fg:#e4ecf3; --muted:#93a5b7; --line:#273848;
  --court:#5b9be0; --ball:#d4ea3a; --ok:#5cc07a; --warn:#e6a23c; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
header{padding-block:20px 8px}

.sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:14px}

.round h2{font-family:var(--display);font-size:1.25rem;margin:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}

.match:first-of-type{border-top:0}
.bana{font-family:var(--display);font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;writing-mode:vertical-rl;transform:rotate(180deg)}
.team{min-width:0;font-size:.95rem;line-height:1.25}
.team.r{text-align:right}
.team.win{font-weight:600}

.dash{color:var(--muted)}

.note{color:var(--muted);font-size:.85rem;margin:10px 2px}

.fmt button[aria-pressed="true"]{background:var(--ball);color:#14263a}
.reset{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.fmt .lbl{font:600 .8rem var(--body);color:var(--muted);padding:7px 4px 7px 12px;text-transform:uppercase;letter-spacing:.05em}

.fmt{flex-wrap:wrap}
.paste{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;display:grid;gap:10px}

.status{font-size:.8rem;color:var(--muted);margin:8px 0 0;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok::before{background:var(--ok)}
.status.busy::before{background:var(--ball)}
.status.warn{color:var(--warn)}.status.warn::before{background:var(--warn)}
.tabs button{padding:10px 4px}
.act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}

.hist .d{font-family:var(--display);font-size:1.2rem;font-weight:700}
.hist .meta{color:var(--muted);font-size:.85rem;text-align:right}
.hist .podium{grid-column:1/-1;font-size:.9rem;color:var(--muted)}
.hist .podium b{color:var(--fg);font-weight:600}
.hist[open] summary{border-bottom:1px solid var(--line)}
.hist table{border:0;border-radius:0}
.hist .foot{padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);text-align:center;padding:28px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
input.s:disabled{opacity:.7}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;margin-bottom:12px}
.chart h3{font:700 1.1rem var(--display);margin:0 0 2px;letter-spacing:.01em}
.chart .cap{color:var(--muted);font-size:.8rem;margin:0 0 6px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .ax{fill:var(--muted);font:10px var(--body);font-variant-numeric:tabular-nums}

.chart .hl{stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .lab{fill:var(--fg);font:600 11px var(--body)}

.chart .xh{stroke:var(--fg);stroke-opacity:.35;stroke-width:1;stroke-dasharray:3 3}
.chart .hit{fill:transparent;cursor:pointer}
.readout{font-size:.85rem;color:var(--muted);margin:6px 2px 0;line-height:1.5}

.readout .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:600 .85rem var(--body);padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .sw{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.35}
.chip[aria-pressed="true"]{border-color:var(--fg)}
.chip[aria-pressed="true"] .sw{opacity:1}
.chartbtn{margin-bottom:12px}
.hist .chartbtn{margin:0;padding:10px 14px;border-bottom:1px solid var(--line)}

.round.final{border-color:var(--court);border-width:2px}

.fin-body{padding:12px 14px;display:grid;gap:10px}
.fin-body p{margin:0;font-size:.9rem;color:var(--muted)}

.fin-res{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.round .fin-res{border:0;border-top:1px solid var(--line);border-radius:0;margin:0}
.fin-res h3{font:700 1.15rem var(--display);margin:0 0 6px}

.fin-res ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-variant-numeric:tabular-nums}
.fin-res li{display:flex;gap:8px;align-items:center;font-size:.95rem}
.fin-res li .pl{width:1.8em;text-align:center;color:var(--muted);font-weight:600}

.hist .fin-res{border:0;border-radius:0;margin:0;border-bottom:1px solid var(--line)}
.hist .chart{border:0;border-radius:0;margin:0;border-bottom:1px solid var(--line)}
</style>

<script>
const DEFAULT_NAMES=Array.from({length:12},(_,i)=>"Spelare "+(i+1));
// per player count: rounds of {m: [[teamA, teamB] per court], r: resting players}
const SCHED={"5":[{"m":[[[0,1],[2,3]]],"r":[4]},{"m":[[[2,1],[4,0]]],"r":[3]},{"m":[[[2,0],[3,4]]],"r":[1]},{"m":[[[4,1],[3,0]]],"r":[2]},{"m":[[[1,3],[2,4]]],"r":[0]}],"6":[{"m":[[[0,1],[3,4]]],"r":[2,5]},{"m":[[[1,2],[5,0]]],"r":[3,4]},{"m":[[[2,3],[4,5]]],"r":[0,1]},{"m":[[[4,1],[3,0]]],"r":[2,5]},{"m":[[[0,2],[1,5]]],"r":[3,4]},{"m":[[[5,3],[4,2]]],"r":[0,1]}],"7":[{"m":[[[5,3],[2,4]]],"r":[0,1,6]},{"m":[[[1,6],[0,2]]],"r":[3,4,5]},{"m":[[[4,5],[3,0]]],"r":[1,2,6]},{"m":[[[1,2],[3,6]]],"r":[0,4,5]},{"m":[[[6,5],[4,0]]],"r":[1,2,3]},{"m":[[[5,1],[3,2]]],"r":[0,4,6]},{"m":[[[1,4],[0,6]]],"r":[2,3,5]}],"8":[{"m":[[[0,1],[2,3]],[[4,5],[6,7]]],"r":[]},{"m":[[[0,2],[4,6]],[[1,3],[5,7]]],"r":[]},{"m":[[[0,3],[4,7]],[[1,2],[5,6]]],"r":[]},{"m":[[[0,4],[1,5]],[[2,6],[3,7]]],"r":[]},{"m":[[[0,5],[2,7]],[[1,4],[3,6]]],"r":[]},{"m":[[[0,6],[3,5]],[[1,7],[2,4]]],"r":[]},{"m":[[[0,7],[1,6]],[[2,5],[3,4]]],"r":[]}],"12":[{"m":[[[5,6],[11,0]],[[3,8],[2,9]],[[4,7],[1,10]]],"r":[]},{"m":[[[5,8],[11,1]],[[3,10],[4,9]],[[2,0],[6,7]]],"r":[]},{"m":[[[7,8],[4,0]],[[3,1],[11,2]],[[6,9],[5,10]]],"r":[]},{"m":[[[11,3],[5,1]],[[7,10],[6,0]],[[4,2],[8,9]]],"r":[]},{"m":[[[5,3],[8,0]],[[7,1],[9,10]],[[6,2],[11,4]]],"r":[]},{"m":[[[6,4],[9,1]],[[8,2],[10,0]],[[11,5],[7,3]]],"r":[]},{"m":[[[9,3],[0,1]],[[10,2],[7,5]],[[11,6],[8,4]]],"r":[]},{"m":[[[10,4],[11,7]],[[0,3],[1,2]],[[8,6],[9,5]]],"r":[]},{"m":[[[2,3],[10,6]],[[0,5],[1,4]],[[9,7],[11,8]]],"r":[]},{"m":[[[3,4],[0,7]],[[11,9],[1,6]],[[2,5],[10,8]]],"r":[]},{"m":[[[11,10],[0,9]],[[2,7],[4,5]],[[3,6],[1,8]]],"r":[]}],"9":[{"m":[[[1,7],[6,3]],[[0,2],[8,5]]],"r":[4]},{"m":[[[6,7],[0,5]],[[2,8],[4,1]]],"r":[3]},{"m":[[[4,7],[1,0]],[[3,8],[5,6]]],"r":[2]},{"m":[[[2,1],[0,6]],[[7,3],[4,8]]],"r":[5]},{"m":[[[4,5],[6,1]],[[7,0],[2,3]]],"r":[8]},{"m":[[[3,4],[2,6]],[[1,5],[0,8]]],"r":[7]},{"m":[[[2,5],[3,1]],[[6,4],[8,7]]],"r":[0]},{"m":[[[4,2],[7,5]],[[6,8],[3,0]]],"r":[1]},{"m":[[[8,1],[2,7]],[[4,0],[5,3]]],"r":[6]}],"10":[{"m":[[[4,0],[9,7]],[[3,6],[2,1]]],"r":[5,8]},{"m":[[[5,2],[8,4]],[[6,9],[7,3]]],"r":[0,1]},{"m":[[[3,1],[7,8]],[[9,0],[6,5]]],"r":[2,4]},{"m":[[[5,0],[7,2]],[[8,1],[9,4]]],"r":[3,6]},{"m":[[[5,8],[6,1]],[[3,4],[0,2]]],"r":[7,9]},{"m":[[[6,8],[7,4]],[[2,3],[5,9]]],"r":[0,1]},{"m":[[[0,6],[8,9]],[[5,3],[1,4]]],"r":[2,7]},{"m":[[[5,1],[6,2]],[[3,8],[0,7]]],"r":[4,9]},{"m":[[[4,2],[7,6]],[[1,9],[0,8]]],"r":[3,5]},{"m":[[[0,3],[5,4]],[[9,2],[1,7]]],"r":[6,8]}],"11":[{"m":[[[5,6],[8,2]],[[1,3],[9,4]]],"r":[0,7,10]},{"m":[[[7,5],[6,4]],[[1,10],[0,8]]],"r":[2,3,9]},{"m":[[[5,9],[7,0]],[[10,2],[3,4]]],"r":[1,6,8]},{"m":[[[6,8],[3,9]],[[10,7],[2,1]]],"r":[0,4,5]},{"m":[[[10,0],[7,2]],[[1,9],[4,5]]],"r":[3,6,8]},{"m":[[[0,1],[3,6]],[[2,4],[8,9]]],"r":[5,7,10]},{"m":[[[3,7],[8,5]],[[10,4],[6,0]]],"r":[1,2,9]},{"m":[[[6,1],[5,2]],[[9,7],[10,8]]],"r":[0,3,4]},{"m":[[[4,0],[2,3]],[[9,6],[7,1]]],"r":[5,8,10]},{"m":[[[2,0],[1,8]],[[5,3],[10,9]]],"r":[4,6,7]},{"m":[[[7,6],[3,0]],[[4,8],[5,10]]],"r":[1,2,9]}]};
const KEY="americano-v1";
const clone=o=>JSON.parse(JSON.stringify(o));
const isObj=o=>o&&typeof o==="object"&&!Array.isArray(o);
function merge(a,b){for(const k in b){if(isObj(b[k])&&isObj(a[k]))merge(a[k],b[k]);else a[k]=clone(b[k])}return a}

let st={v:2,size:12,total:16,names:{},scores:{}};
try{
  const s=JSON.parse(localStorage.getItem(KEY));
  if(s&&s.v===2)st=Object.assign(st,s);
  else if(s&&s.names){st.size=s.size||12;st.total=s.total||16;st.names={12:s.names,8:s.names8||DEFAULT_NAMES.slice(0,8)};st.scores={12:s.scores||{},8:s.scores8||{}}}
}catch(e){}

/* ---------- shared storage ---------- */
let db=null, cur=null, docExists=false, readOnly=false;
let patch=null, inflight=null, full=false, writing=false, timer=null, pendingRemote=null;
let history=[], histState="loading";
const HKEY="americano-history-v1";
function loadHist(){try{const h=JSON.parse(localStorage.getItem(HKEY));return Array.isArray(h)?h.sort((a,b)=>b.savedAt-a.savedAt):[]}catch(e){return[]}}
function saveHist(){try{localStorage.setItem(HKEY,JSON.stringify(history));return true}catch(e){return false}}
function status(text,cls){const el=document.getElementById("status");el.textContent=text;el.className="status "+(cls||"")}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
// queue a change: p is a partial state object that is merged into the shared document
function queue(p,whole){
  saveLocal();

function standingsFor(p,names,scores){

    m[1].forEach(x=>{rows[x].pts+=b;rows[x].ag+=a;rows[x].m++;if(b>a)rows[x].w++});
  }));

function progress(p,names,scores){
  const sched=SX(p), rest=sched[0].r.length>0;
  const pts=Array(p).fill(0), m=Array(p).fill(0);
  const rounds=[]; let last=0;
  sched.forEach((rd,ri)=>{if(rd.m.some((_,ci)=>{const s=scores[ri+"-"+ci];return s&&s[0]!==""&&s[1]!==""}))last=ri+1});
  const series=Array.from({length:p},(_,i)=>({i,name:names[i]||("Spelare "+(i+1)),v:[rest?null:0]}));
  for(let ri=0;ri<last;ri++){
    sched[ri].m.forEach((mm,ci)=>{
      const s=scores[ri+"-"+ci]; if(!s||s[0]===""||s[1]==="")return;

  const path=v=>{let d="",pen=false;v.forEach((y,r)=>{if(y==null){pen=false;return}d+=(pen?"L":"M")+X(r).toFixed(1)+" "+Y(y).toFixed(1);pen=true});return d};
  let g="";
  for(let k=0;k<=4;k++){const v=ymax*k/4,y=Y(v);g+=`<line class="grid" x1="${L}" x2="${L+pw}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${y+4}" text-anchor="end">${pr.rest?fmt1(v):Math.round(v)}</text>`}
  const step=R>9?2:1;
  for(let r=0;r<=R;r+=step)g+=`<text class="ax" x="${X(r)}" y="${H-6}" text-anchor="middle">${r===0?"Start":r}</text>`;
  const selIdx=new Set(sel.map(x=>x.i));
  pr.series.forEach(s=>{if(!selIdx.has(s.i))g+=`<path class="bg" d="${path(s.v)}"/>`});
  // highlighted lines, end markers and direct labels (spread so they don't collide)
  const labs=sel.map(x=>{const s=pr.series[x.i];const v=s.v[pr.last];return{...x,s,v,y:v==null?null:Y(v)}}).filter(l=>l.y!=null).sort((a,b)=>a.y-b.y);
  for(let k=1;k<labs.length;k++)if(labs[k].y-labs[k-1].y<15)labs[k].y=labs[k-1].y+15;
  sel.forEach(x=>{const s=pr.series[x.i];g+=`<path class="hl" stroke="var(--s${x.c})" d="${path(s.v)}"/>`});
  sel.forEach(x=>{const v=pr.series[x.i].v[pr.last];if(v!=null)g+=`<circle cx="${X(pr.last)}" cy="${Y(v)}" r="4.5" fill="var(--s${x.c})" stroke="var(--surface)" stroke-width="2"/>`});
  labs.forEach(l=>{const nm=l.s.name.length>8?l.s.name.slice(0,7)+"…":l.s.name;g+=`<circle cx="${X(pr.last)+11}" cy="${l.y}" r="3.5" fill="var(--s${l.c})"/><text class="lab" x="${X(pr.last)+18}" y="${l.y+4}">${esc(nm)} <tspan class="labv">${pr.rest?fmt1(l.v):l.v}</tspan></text>`});
  // crosshair at the inspected round
  g+=`<line class="xh" x1="${X(xr)}" x2="${X(xr)}" y1="${Tp}" y2="${Tp+ph}"/>`;
  for(let r=0;r<=pr.last;r++){const x0=r===0?L:(X(r-1)+X(r))/2,x1=r===pr.last?X(r)+pw/R/2:(X(r)+X(r+1))/2;g+=`<rect class="hit" data-ck="${esc(key)}" data-cr="${r}" x="${x0}" y="${Tp}" width="${x1-x0}" height="${ph}"/>`}
  // readout: standings after the inspected round
  const col={};sel.forEach(x=>col[x.i]=x.c);
  const at=pr.series.map(s=>({i:s.i,name:s.name,v:s.v[xr]})).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
  const ro=xr===0?"Start: alla på 0.":`<b>Efter runda ${xr}:</b> `+at.map((x,k)=>`${col[x.i]?`<span class="sw" style="background:var(--s${col[x.i]})"></span>`:""}${k+1}. ${col[x.i]?`<b>${esc(x.name)}</b>`:esc(x.name)} ${pr.rest?fmt1(x.v):x.v}`).join(" · ");
  const chips=pr.series.map(s=>{const c=col[s.i];return `<button class="chip" data-ck="${esc(key)}" data-ci="${s.i}" aria-pressed="${!!c}"><span class="sw"${c?` style="background:var(--s${c})"`:""}></span>${esc(s.name)}</button>`}).join("");
  return `<div class="chart" data-chart="${esc(key)}"><div class="chead"><h3>Poängutveckling</h3><button class="btn sm" data-cclose="${esc(key)}">Dölj</button></div><p class="cap">${pr.rest?"Snittpoäng per match":"Totalpoäng"} efter varje runda. Tryck i grafen för att se ställningen, och på namnen för att jämföra upp till fyra spelare.</p>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Linjediagram över poäng per runda">${g}</svg>
  <p class="readout">${ro}</p><div class="chips">${chips}</div></div>`;
}
const chartSrc={};
function rerenderChart(key){
  const box=document.querySelector(`[data-chart="${CSS.escape(key)}"]`), src=chartSrc[key];
  if(box&&src)box.outerHTML=chartHTML(key,src.p,src.names,src.scores);
}
function toggleSel(key,i){
  let sel=chartSel[key]||[];
  if(sel.some(x=>x.i===i))sel=sel.filter(x=>x.i!==i);
  else{if(sel.length>=4)sel=sel.slice(1);const used=new Set(sel.map(x=>x.c));let c=1;while(used.has(c))c++;sel=sel.concat({i,c})}
  chartSel[key]=sel; rerenderChart(key);
}
document.addEventListener("pointerover",e=>{const t=e.target;if(t.dataset&&t.dataset.cr!==undefined&&e.pointerType==="mouse"){const k=t.dataset.ck,r=+t.dataset.cr;if(chartRound[k]!==r){chartRound[k]=r;rerenderChart(k)}}});
document.addEventListener("click",e=>{
  const t=e.target;
  const ob=t.closest&&t.closest("[data-copen],[data-cclose]");
  if(ob){const k=ob.dataset.copen||ob.dataset.cclose;chartOpen[k]=!!ob.dataset.copen;
    if(k==="live")try{localStorage.setItem("americano-chart",chartOpen[k]?"1":"0")}catch(err){}
    rerenderChart(k);return}
  if(t.dataset&&t.dataset.cr!==undefined){chartRound[t.dataset.ck]=+t.dataset.cr;rerenderChart(t.dataset.ck);return}
  const c=t.closest&&t.closest(".chip");if(c){toggleSel(c.dataset.ck,+c.dataset.ci)}
});

/* ---------- events ---------- */
let nameTimer=null;
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.k){
    const v=t.value.replace(/\D/g,"").slice(0,2); t.value=v;
    const sc=SC(), s=sc[t.dataset.k]||["",""]; s[+t.dataset.i]=v; sc[t.dataset.k]=s;
    saveLocal(); delete chartRound.live; renderTable();
  }
  if(t.id==="pastebox")pasteText=t.value;
  if(t.dataset.n!==undefined){
    NM()[+t.dataset.n]=t.value;
    clearTimeout(nameTimer); nameTimer=setTimeout(()=>queue({names:{[P()]:NM().slice()}}),700);
  }
});
// fill the other side when the entry is finished, so "1" isn't taken as final before "12" is typed
document.addEventListener("focusin",e=>{const t=e.target;if(t.dataset&&t.dataset.n!==undefined&&t.select)setTimeout(()=>t.select(),0)});
document.addEventListener("focusout",e=>{
  const t=e.target;
  if(t.dataset.k){
    const sc=SC(), s=sc[t.dataset.k]||["",""], v=t.value, o=1-+t.dataset.i;
    if(v!==""&&+v<=T()&&s[o]===""){s[o]=String(T()-+v);document.getElementById("s"+t.dataset.k+(o?"b":"a")).value=s[o]}
    sc[t.dataset.k]=s;
    queue({scores:{[P()]:{[t.dataset.k]:s.slice()}}});
    renderTable();
  }
  if(t.dataset.n!==undefined){clearTimeout(nameTimer);queue({names:{[P()]:NM().slice()}})}
  setTimeout(()=>{
    if(editing())return;
    if(pendingRemote){const d=pendingRemote;pendingRemote=null;applyRemote(d)}
    else if(t.dataset.k){const y=window.scrollY;renderRounds();window.scrollTo(0,y)}
  },0);
});
document.addEventListener("click",async e=>{
  const tg=e.target.closest("button"); if(!tg||tg.classList.contains("chip"))return;
  const d=tg.dataset, v=d.v;
  if(v){document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
    ["rounds","table","names","hist"].forEach(id=>document.getElementById(id).hidden=id!==v);
    if(v==="rounds")renderRounds(); if(v==="table")renderTable(); if(v==="names")renderNames(); if(v==="hist")renderHist();
    window.scrollTo(0,0);return}
  if(d.p){if(readOnly)return;st.size=+d.p;delete chartSel.live;delete chartRound.live;queue({size:st.size,names:{[P()]:NM().slice()}});justSaved=false;saveOpen=false;all();return}
  if(d.f){if(readOnly)return;st.total=+d.f;queue({total:st.total});renderFmt();renderRounds();renderTable();return}
  if(tg.id==="pasteuse"){useNames(document.getElementById("pastebox").value);return}
  if(tg.id==="pasteclip"){
    try{const t=await navigator.clipboard.readText();pasteText=t;useNames(t)}
    catch(err){pasteMsg={t:"Telefonen tillät inte att läsa urklipp. Tryck i rutan och välj Klistra in i stället.",warn:true};renderNames()}
    return}
  if(tg.id==="nclr"){if(readOnly)return;st.names[P()]=Array(P()).fill("");queue({names:{[P()]:NM().slice()}});pasteMsg=null;all();const f=document.getElementById("n0");if(f)f.focus();return}
  if(tg.id==="fstart"&&!readOnly){
    const order=standingsFor(P(),NM(),SC()).rows.map(r=>r.i);
    st.seed=st.seed||{}; st.seed[P()]=order; queue({seed:{[P()]:order.slice()}});
    const y=window.scrollY; renderRounds(); renderTable(); window.scrollTo(0,y); return}
  if(tg.id==="fredo"||tg.id==="fredono"){fredoAsk=tg.id==="fredo";const y=window.scrollY;renderRounds();window.scrollTo(0,y);return}
  if(tg.id==="fredo2"&&!readOnly){
    const sc=SC(); Object.keys(sc).forEach(k=>{if(k.startsWith("F-"))delete sc[k]});
    st.seed=st.seed||{}; st.seed[P()]=standingsFor(P(),NM(),sc).rows.map(r=>r.i);
    fredoAsk=false; queue(null,true); const y=window.scrollY; renderRounds(); renderTable(); window.scrollTo(0,y); return}
  if(tg.id==="clr")document.getElementById("cf").hidden=false;
  if(tg.id==="no")document.getElementById("cf").hidden=true;
  if(tg.id==="yes"||tg.id==="clr2")clearScores();
  if(tg.id==="keep"){justSaved=false;renderTable()}
  if(tg.id==="sopen"){saveOpen=true;renderTable()}
  if(tg.id==="sno"){saveOpen=false;renderTable()}
  if(tg.id==="sdo"){
    const date=document.getElementById("sdate").value||todayISO();
    tg.disabled=true;
    try{
      const rec={date,savedAt:Date.now(),size:P(),total:T(),names:NM().slice(),scores:clone(SC()),seed:SEED()?SEED().slice():null};
      if(db)await db.collection("history").add(rec);
      else{history.unshift(Object.assign({id:"h"+rec.savedAt},rec));if(!saveHist()){history.shift();throw{code:"quota_exceeded"}}renderHist()}
      saveOpen=false;justSaved=true;renderTable();
    }catch(err){tg.disabled=false;status(err&&err.code==="quota_exceeded"?"Lagringen är full – ta bort gamla kvällar under Tidigare":"Kunde inte spara kvällen – försök igen","warn")}
  }
  if(d.hask){delId=d.hask;renderHist()}
  if(d.hno){delId=null;renderHist()}
  if(d.hdel){try{if(db)await db.doc("history/"+d.hdel).delete();else{history=history.filter(h=>h.id!==d.hdel);saveHist()}}catch(err){status("Kunde inte ta bort – försök igen","warn")}delId=null;renderHist()}
});
all();
</script>


<script>if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
